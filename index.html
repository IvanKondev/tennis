<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>Тенис Лига Велинград</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<script src="data.js"></script>
<script src="app.js"></script>
<script defer src="alpine.min.js"></script>
</head>
<body x-data="tennisApp" x-cloak>
  <!-- Toast (auto-refresh notifications) -->
  <div class="toast" x-show="toast" x-transition.opacity x-text="toast"></div>

  <!-- HERO (compact, only on standings) -->
  <header class="hero" x-show="view === 'standings'">
    <h1 class="hero-title">
      <span class="line-1">Тенис Лига</span>
      <span class="line-2">Велинград</span>
    </h1>
    <div class="hero-stats">
      <span><b x-text="players.length"></b> играчи</span>
      <span class="hero-sep">·</span>
      <span><b x-text="playedMatches.length"></b>/<span x-text="matches.length"></span> мача</span>
      <span class="hero-sep">·</span>
      <span><b x-text="scheduledMatches.length"></b> планирани</span>
      <span class="hero-sep">·</span>
      <span><b x-text="Math.round(playedMatches.length / matches.length * 100) + '%'"></b></span>
    </div>
  </header>

  <main>

    <!-- ===== STANDINGS ===== -->
    <section class="panel" x-show="view === 'standings'">
      <!-- Live banner -->
      <template x-if="liveMatchesList.length > 0">
        <div class="live-banner">
          <div class="live-banner-head">
            <span class="live-dot"></span>
            <span>На живо в момента</span>
          </div>
          <template x-for="m in liveMatchesList" :key="m.key">
            <div class="live-banner-row" @click="openLive(m)">
              <span class="live-banner-vs">
                <span x-text="m.p1"></span>
                <span class="live-banner-sep">vs</span>
                <span x-text="m.p2"></span>
              </span>
              <span class="live-banner-score" x-text="formatLiveScore(m)"></span>
            </div>
          </template>
        </div>
      </template>

      <!-- Today's matches quick-write -->
      <template x-if="todaysMatches.length > 0">
        <div class="today-banner">
          <div class="today-banner-head">📅 Мачове днес — въведи резултат</div>
          <template x-for="m in todaysMatches" :key="m.key">
            <div class="today-banner-row" :class="{'is-live': isMatchLive(m)}">
              <div class="today-banner-info">
                <span class="today-banner-time" x-text="m.scheduledAt.slice(11,16)"></span>
                <span class="today-banner-vs">
                  <span x-text="m.p1"></span>
                  <span class="today-banner-sep">vs</span>
                  <span x-text="m.p2"></span>
                </span>
              </div>
              <template x-if="isMatchLive(m)">
                <button class="btn-live small" @click="openLive(m)">
                  <span class="live-dot"></span>
                  <span x-text="formatLiveScore(m)"></span>
                </button>
              </template>
              <template x-if="!isMatchLive(m)">
                <div class="today-banner-actions">
                  <button class="btn-live small" @click="openLive(m)">🔴 Live</button>
                  <button class="btn-final small" @click="openScore(m)">🏁</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- Podium -->
      <template x-if="standings[0] && standings[0].played > 0">
        <div class="podium">
          <template x-if="standings[1]">
            <div class="podium-spot p2" @click="jumpToPlayer(standings[1].name)">
              <div class="podium-medal">🥈</div>
              <div class="avatar lg" :style="`--avatar-hue:${playerHue(standings[1].name)}`" x-text="initials(standings[1].name)"></div>
              <div class="podium-name" x-text="standings[1].name"></div>
              <div class="podium-points"><span x-text="standings[1].points"></span> т.</div>
            </div>
          </template>
          <div class="podium-spot p1" @click="jumpToPlayer(standings[0].name)">
            <div class="podium-crown">👑</div>
            <div class="podium-medal">🥇</div>
            <div class="avatar xl" :style="`--avatar-hue:${playerHue(standings[0].name)}`" x-text="initials(standings[0].name)"></div>
            <div class="podium-name" x-text="standings[0].name"></div>
            <div class="podium-points"><span x-text="standings[0].points"></span> т.</div>
          </div>
          <template x-if="standings[2]">
            <div class="podium-spot p3" @click="jumpToPlayer(standings[2].name)">
              <div class="podium-medal">🥉</div>
              <div class="avatar lg" :style="`--avatar-hue:${playerHue(standings[2].name)}`" x-text="initials(standings[2].name)"></div>
              <div class="podium-name" x-text="standings[2].name"></div>
              <div class="podium-points"><span x-text="standings[2].points"></span> т.</div>
            </div>
          </template>
        </div>
      </template>

      <div class="panel-head">
        <h2>Класиране</h2>
        <p>Точки → победи → разлика в сетове · <em>тапни играч за подробности</em></p>
      </div>
      <div class="standings-wrap">
        <table class="standings">
          <thead>
            <tr>
              <th>#</th>
              <th class="left">Играч</th>
              <th class="hide-mobile">И</th>
              <th>П</th>
              <th class="hide-mobile">З</th>
              <th>Сетове</th>
              <th>Точки</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(s, i) in standings" :key="s.name">
              <tr @click="jumpToPlayer(s.name)" class="clickable">
                <td><span class="rank" :class="`rank-${i+1}`" x-text="i+1"></span></td>
                <td class="player-cell">
                  <span class="avatar" :style="`--avatar-hue:${playerHue(s.name)}`" x-text="initials(s.name)"></span>
                  <span class="player-name" x-text="s.name"></span>
                </td>
                <td class="hide-mobile" x-text="s.played"></td>
                <td x-text="s.wins"></td>
                <td class="hide-mobile" x-text="s.losses"></td>
                <td class="sets"><span x-text="s.setsWon"></span>:<span x-text="s.setsLost"></span></td>
                <td class="points" x-text="s.points"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ===== UPCOMING ===== -->
    <section class="panel" x-show="view === 'upcoming'">
      <div class="panel-head">
        <h2>Предстоящи</h2>
        <p>Планирани мачове по дата</p>
      </div>
      <template x-if="scheduledMatches.length === 0">
        <div class="empty-state">
          <div class="empty-icon">📅</div>
          <h3>Няма планирани мачове</h3>
          <p>Админът може да планира мачове от админ панела.</p>
        </div>
      </template>
      <div class="upcoming-list">
        <template x-for="m in scheduledMatches" :key="m.key">
          <div class="upcoming-card" :class="{'is-today': isMatchToday(m), 'is-live': isMatchLive(m)}">
            <div class="upcoming-date-row">
              <div class="upcoming-date">
                <span x-text="formatDateLong(m.scheduledAt)"></span>
              </div>
              <span class="upcoming-when-pill" x-show="dateRelative(m.scheduledAt)" x-text="dateRelative(m.scheduledAt)"></span>
            </div>
            <div class="upcoming-vs">
              <div class="upcoming-player" @click="jumpToPlayer(m.p1)">
                <span class="avatar lg" :style="`--avatar-hue:${playerHue(m.p1)}`" x-text="initials(m.p1)"></span>
                <span class="upcoming-name" x-text="m.p1"></span>
              </div>
              <div class="upcoming-vs-sep">VS</div>
              <div class="upcoming-player right" @click="jumpToPlayer(m.p2)">
                <span class="avatar lg" :style="`--avatar-hue:${playerHue(m.p2)}`" x-text="initials(m.p2)"></span>
                <span class="upcoming-name" x-text="m.p2"></span>
              </div>
            </div>
            <template x-if="isMatchLive(m)">
              <div class="live-strip" @click="openLive(m)">
                <span class="live-dot"></span>
                <span class="live-label">НА ЖИВО</span>
                <span class="live-score" x-text="formatLiveScore(m)"></span>
                <span class="live-arrow">→</span>
              </div>
            </template>
            <template x-if="canWriteToday(m) && !isMatchLive(m)">
              <div class="today-actions">
                <button class="btn-live" @click="openLive(m)">🔴 На живо</button>
                <button class="btn-final" @click="openScore(m)">🏁 Краен резултат</button>
              </div>
            </template>
          </div>
        </template>
      </div>
    </section>

    <!-- ===== MATCHES ===== -->
    <template x-if="view === 'matches'">
    <section class="panel">
      <div class="panel-head">
        <h2>Мачове</h2>
        <p x-show="matchPlayerFilter">
          Показване на мачовете на <strong x-text="matchPlayerFilter"></strong>
          <button class="link-btn" @click="matchPlayerFilter=''">✕ махни филтъра</button>
        </p>
      </div>

      <div class="filters sticky-filters">
        <button type="button" class="select-trigger"
          @click="openPlayerPicker(name => matchPlayerFilter = name || '', { title: 'Филтър по играч' })">
          <span class="select-trigger-label">
            <template x-if="matchPlayerFilter">
              <span class="select-trigger-current">
                <span class="avatar sm" :style="`--avatar-hue:${playerHue(matchPlayerFilter)}`" x-text="initials(matchPlayerFilter)"></span>
                <span x-text="matchPlayerFilter"></span>
              </span>
            </template>
            <template x-if="!matchPlayerFilter">
              <span class="select-trigger-placeholder">👥 Всички играчи</span>
            </template>
          </span>
          <span class="select-arrow">▾</span>
        </button>

        <div class="chip-row scrollable">
          <button class="chip" :class="{active: matchFilter==='all'}" @click="matchFilter='all'">Всички</button>
          <button class="chip" :class="{active: matchFilter==='played'}" @click="matchFilter='played'">✓ Изиграни</button>
          <button class="chip" :class="{active: matchFilter==='upcoming'}" @click="matchFilter='upcoming'">📅 Предстоящи</button>
        </div>

        <input type="search" x-model="matchSearch" placeholder="🔍 Търси играч..." />
      </div>

      <template x-if="groupedMatches.length === 0">
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <h3>Няма намерени мачове</h3>
          <p>Опитай с друго търсене.</p>
        </div>
      </template>

      <template x-for="g in groupedMatches" :key="g.player">
        <div class="match-group">
          <div class="match-group-head" @click="jumpToPlayer(g.player)">
            <span class="avatar sm" :style="`--avatar-hue:${playerHue(g.player)}`" x-text="initials(g.player)"></span>
            <span class="match-group-name" x-text="g.player"></span>
            <span class="match-group-count">
              <span x-text="g.matches.filter(m=>m.played).length"></span> /
              <span x-text="g.matches.length"></span>
            </span>
          </div>
          <div class="match-group-list">
            <template x-for="m in g.matches" :key="m.key">
              <div class="match" :class="{played: m.played, scheduled: !m.played && m.scheduledAt, 'is-live': isMatchLive(m)}">
                <div class="match-top">
                  <span class="match-num">#<span x-text="m.num"></span></span>
                  <template x-if="isMatchLive(m)">
                    <span class="match-status live"><span class="live-dot"></span> LIVE <span x-text="formatLiveScore(m)"></span></span>
                  </template>
                  <template x-if="!isMatchLive(m) && !m.played && m.scheduledAt">
                    <span class="match-date">📅 <span x-text="formatDate(m.scheduledAt)"></span></span>
                  </template>
                  <template x-if="m.played">
                    <span class="match-status played">✓ Изигран</span>
                  </template>
                  <template x-if="!isMatchLive(m) && !m.played && !m.scheduledAt">
                    <span class="match-status pending">Чака</span>
                  </template>
                </div>
                <div class="match-row">
                  <div class="match-player" :class="m.played ? (m.winner===m.p1 ? 'winner' : 'loser') : ''" @click.stop="jumpToPlayer(m.p1)">
                    <span class="avatar sm" :style="`--avatar-hue:${playerHue(m.p1)}`" x-text="initials(m.p1)"></span>
                    <span class="name" x-text="m.p1"></span>
                  </div>
                  <div class="match-score">
                    <template x-if="m.played">
                      <div>
                        <span :class="m.s1>m.s2 ? 's-win' : 's-loss'" x-text="m.s1"></span>
                        <span class="score-sep">:</span>
                        <span :class="m.s2>m.s1 ? 's-win' : 's-loss'" x-text="m.s2"></span>
                      </div>
                    </template>
                    <template x-if="!m.played">
                      <span class="score-pending">vs</span>
                    </template>
                  </div>
                  <div class="match-player right" :class="m.played ? (m.winner===m.p2 ? 'winner' : 'loser') : ''" @click.stop="jumpToPlayer(m.p2)">
                    <span class="name" x-text="m.p2"></span>
                    <span class="avatar sm" :style="`--avatar-hue:${playerHue(m.p2)}`" x-text="initials(m.p2)"></span>
                  </div>
                </div>
                <template x-if="canWriteToday(m)">
                  <div class="match-actions">
                    <template x-if="isMatchLive(m)">
                      <button class="btn-mini btn-live-mini" @click.stop="openLive(m)">🔴 Продължи на живо</button>
                    </template>
                    <template x-if="!isMatchLive(m)">
                      <button class="btn-mini btn-live-mini" @click.stop="openLive(m)">🔴 На живо</button>
                    </template>
                    <button class="btn-mini" @click.stop="openScore(m)">🏁 Краен</button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>
    </template>

    <!-- ===== ДВУБОИ (H2H) ===== -->
    <template x-if="view === 'grid'">
    <section class="panel">
      <div class="panel-head">
        <h2>Двубои</h2>
        <p>Резултатите на всеки срещу всеки</p>
      </div>

      <!-- MOBILE: vertical expandable cards -->
      <div class="duels-mobile">
        <template x-for="p in players" :key="p">
          <div class="duel-card" :class="{open: duelExpanded === p}">
            <button class="duel-card-head" @click="duelExpanded = duelExpanded === p ? null : p">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(p)}`" x-text="initials(p)"></span>
              <div class="duel-card-info">
                <span class="duel-card-name" x-text="p"></span>
                <span class="duel-card-record">
                  <span class="wl-w" x-text="h2hRowSummary(p).wins"></span><span class="wl-sep">-</span><span class="wl-l" x-text="h2hRowSummary(p).losses"></span>
                  <span class="duel-card-points" x-text="playerPoints(p) + ' т.'"></span>
                </span>
              </div>
              <span class="duel-card-arrow">▾</span>
            </button>
            <div class="duel-card-body" x-show="duelExpanded === p" x-transition.duration.200ms>
              <template x-for="op in duelOpponents(p)" :key="op">
                <div class="duel-row" :class="duelRowClass(p, op)" @click="jumpToPlayer(op)">
                  <span class="avatar sm" :style="`--avatar-hue:${playerHue(op)}`" x-text="initials(op)"></span>
                  <span class="duel-row-name" x-text="op"></span>
                  <span class="duel-row-result" x-text="duelRowText(p, op)"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- DESKTOP: full grid -->
      <div class="grid-wrap desktop-only">
        <table class="h2h">
          <thead>
            <tr>
              <th class="corner"></th>
              <template x-for="p in players" :key="p">
                <th class="col-header" :title="p" x-text="p"></th>
              </template>
              <th class="col-summary-head">В-З</th>
              <th class="col-summary-head total">Точки</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="rowP in players" :key="rowP">
              <tr>
                <th class="row-header" @click="jumpToPlayer(rowP)">
                  <span class="avatar sm" :style="`--avatar-hue:${playerHue(rowP)}`" x-text="initials(rowP)"></span>
                  <span x-text="rowP"></span>
                </th>
                <template x-for="colP in players" :key="colP">
                  <td :class="cellClass(rowP, colP)" x-text="cellText(rowP, colP)" :title="cellTitle(rowP, colP)"></td>
                </template>
                <td class="cell-wl">
                  <span class="wl-w" x-text="h2hRowSummary(rowP).wins"></span><span class="wl-sep">-</span><span class="wl-l" x-text="h2hRowSummary(rowP).losses"></span>
                </td>
                <td class="cell-points" x-text="playerPoints(rowP)"></td>
              </tr>
            </template>
            <tr class="summary-row">
              <th class="row-header total">Точки</th>
              <template x-for="colP in players" :key="colP">
                <td class="cell-points" x-text="playerPoints(colP)"></td>
              </template>
              <td class="cell-self">—</td>
              <td class="cell-self">—</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="legend desktop-only">
        <span><span class="lg-mark lg-win"></span>Победа</span>
        <span><span class="lg-mark lg-loss"></span>Загуба</span>
        <span><span class="lg-mark lg-pending"></span>Предстоящ</span>
        <span class="legend-hint">Тапни име за подробности</span>
      </div>
    </section>
    </template>

    <!-- ===== ADMIN ===== -->
    <template x-if="view === 'admin'">
    <section class="panel">
      <template x-if="!isAdmin">
        <div class="admin-locked">
          <div class="lock-icon">🔒</div>
          <h2 x-text="needsPasswordSetup ? 'Първоначално настройване' : 'Заключено'"></h2>
          <p x-text="needsPasswordSetup ? 'Задай нова парола за админ достъп' : 'Въведи администраторска парола'"></p>
          <form @submit.prevent="submitPassword()" class="login-form">
            <input type="password" x-model="passwordInput" placeholder="Парола" autocomplete="current-password" required />
            <button type="submit" class="btn-primary full" x-text="needsPasswordSetup ? 'Задай парола' : 'Влез'"></button>
            <p class="error" x-show="passwordError" x-text="passwordError"></p>
          </form>
        </div>
      </template>

      <template x-if="isAdmin">
        <div class="admin-panel">
          <div class="admin-head">
            <div>
              <h2>Админ</h2>
              <p class="admin-status">
                <span class="dot"></span>
                <span x-show="backendMode === 'api'">Сървър · </span>
                <span x-show="backendMode === 'local'">Локално · </span>
                <span x-show="!saveStatus">Активен</span>
                <span x-show="saveStatus === 'saving'" class="status-saving">Запис...</span>
                <span x-show="saveStatus === 'saved'" class="status-saved">✓ Запазено</span>
                <span x-show="saveStatus === 'error'" class="status-error">✕ Грешка</span>
              </p>
            </div>
            <div class="admin-tools">
              <button class="btn-icon" @click="exportData()" title="Експорт">⬇</button>
              <label class="btn-icon" title="Импорт">
                ⬆<input type="file" accept=".json,application/json" @change="importData($event)" hidden />
              </label>
              <button class="btn-icon" @click="logout()" title="Изход">✕</button>
            </div>
          </div>

          <!-- Quick actions -->
          <div class="quick-actions">
            <button class="quick-btn primary" @click="openWizard('schedule')">
              <span class="quick-icon">📅</span>
              <span class="quick-text">
                <strong>Планирай мач</strong>
                <small>Играч → опонент → дата → час</small>
              </span>
              <span class="quick-arrow">→</span>
            </button>
            <button class="quick-btn" @click="openWizard('result')">
              <span class="quick-icon">🎾</span>
              <span class="quick-text">
                <strong>Запиши резултат</strong>
                <small>Играч → опонент → резултат</small>
              </span>
              <span class="quick-arrow">→</span>
            </button>
          </div>

          <div class="admin-toolbar">
            <div class="chip-row scrollable">
              <button class="chip" :class="{active: matchFilter==='scheduled'}" @click="matchFilter='scheduled'">
                📅 Планирани · <span x-text="scheduledMatches.length"></span>
              </button>
              <button class="chip" :class="{active: matchFilter==='pending'}" @click="matchFilter='pending'">
                ⏳ Чакащи · <span x-text="matches.filter(m=>!m.played && !m.scheduledAt).length"></span>
              </button>
              <button class="chip" :class="{active: matchFilter==='played'}" @click="matchFilter='played'">
                ✓ Изиграни · <span x-text="playedMatches.length"></span>
              </button>
              <button class="chip" :class="{active: matchFilter==='all'}" @click="matchFilter='all'">
                Всички
              </button>
            </div>
            <input type="search" x-model="matchSearch" placeholder="🔍 Търси играч..." class="admin-search" />
          </div>

          <div class="admin-list">
            <template x-for="m in filteredMatches" :key="m.key">
              <div class="admin-match" :class="{played: m.played, scheduled: !m.played && m.scheduledAt, 'is-live': isMatchLive(m)}">
                <div class="admin-match-info">
                  <div class="admin-match-top">
                    <span class="match-num">#<span x-text="m.num"></span></span>
                    <template x-if="isMatchLive(m)">
                      <span class="match-status live"><span class="live-dot"></span> LIVE <span x-text="formatLiveScore(m)"></span></span>
                    </template>
                    <template x-if="m.played">
                      <span class="match-status played">✓</span>
                    </template>
                    <template x-if="!isMatchLive(m) && !m.played && m.scheduledAt">
                      <span class="match-date">📅 <span x-text="formatDate(m.scheduledAt)"></span></span>
                    </template>
                  </div>
                  <div class="admin-match-vs">
                    <span :class="{strong: m.played && m.winner===m.p1}" x-text="m.p1"></span>
                    <template x-if="m.played">
                      <span class="admin-score" x-text="m.s1 + ':' + m.s2"></span>
                    </template>
                    <template x-if="!m.played">
                      <span class="sep">vs</span>
                    </template>
                    <span :class="{strong: m.played && m.winner===m.p2}" x-text="m.p2"></span>
                  </div>
                </div>
                <div class="admin-match-actions">
                  <template x-if="!m.played">
                    <button class="btn-mini btn-live-mini" @click="openLive(m)" x-text="isMatchLive(m) ? '🔴 Продължи' : '🔴 На живо'"></button>
                  </template>
                  <template x-if="!m.played">
                    <button class="btn-mini btn-primary" @click="openScore(m)">🎾 Резултат</button>
                  </template>
                  <template x-if="!m.played">
                    <button class="btn-mini" @click="openSchedule(m)" x-text="m.scheduledAt ? '📅 Прегласувай' : '📅 Планирай'"></button>
                  </template>
                  <template x-if="!m.played && m.scheduledAt">
                    <button class="btn-mini btn-danger" @click="if(confirm('Откажи планираната дата?')) clearSchedule(m)">✕</button>
                  </template>
                  <template x-if="isMatchLive(m)">
                    <button class="btn-mini btn-danger" @click="clearLive(m)" title="Изтрий live">✕ Live</button>
                  </template>
                  <template x-if="m.played">
                    <button class="btn-mini" @click="openScore(m)">✎ Редактирай</button>
                  </template>
                  <template x-if="m.played">
                    <button class="btn-mini btn-danger" @click="if(confirm('Изтрий резултата?')) clearResult(m)">✕</button>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="scheduleMatch">
        <div>
          <div class="modal-head">

          </div>
          <div class="modal-vs">
            <div class="modal-vs-player">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(scheduleMatch.p1)}`" x-text="initials(scheduleMatch.p1)"></span>

  <!-- ===== WIZARD MODAL ===== -->
  <div class="modal-backdrop wizard-backdrop" x-show="wizard.open" @click.self="closeWizard()" x-transition.opacity style="display:none">
    <div class="modal wizard-modal" x-show="wizard.open" x-transition>
      <div class="wizard-head">
        <button class="btn-close" @click="wizard.step > 1 ? wizardBack() : closeWizard()" x-text="wizard.step > 1 ? '←' : '✕'"></button>
        <div class="wizard-title">
          <h3 x-text="wizardTitle"></h3>
          <div class="wizard-steps">
            <template x-for="i in (wizard.mode === 'schedule' ? 4 : 3)" :key="i">
              <span class="wizard-dot" :class="{active: i <= wizard.step, current: i === wizard.step}"></span>
            </template>
          </div>
        </div>
        <div style="width:36px"></div>
      </div>

      <template x-if="wizard.step >= 2">
        <div class="wizard-summary">
          <div class="wizard-summary-pill">
            <span class="avatar sm" :style="`--avatar-hue:${playerHue(wizard.playerA)}`" x-text="initials(wizard.playerA)"></span>
            <span x-text="wizard.playerA"></span>
          </div>
          <template x-if="wizard.playerB">
            <span class="wizard-summary-vs">vs</span>
          </template>
          <template x-if="wizard.playerB">
            <div class="wizard-summary-pill">
              <span class="avatar sm" :style="`--avatar-hue:${playerHue(wizard.playerB)}`" x-text="initials(wizard.playerB)"></span>
              <span x-text="wizard.playerB"></span>
            </div>
          </template>
        </div>
      </template>

      <!-- STEP 1: Player A (with scheduled shortcuts for result mode) -->
      <div class="wizard-step" x-show="wizard.step === 1">
        <template x-if="wizard.mode === 'result' && scheduledMatches.length > 0">
          <div>
            <div class="wizard-section-title">📅 Планирани мачове · бързо записване</div>
            <div class="scheduled-shortcuts">
              <template x-for="m in scheduledMatches" :key="m.key">
                <button class="scheduled-shortcut" @click="wizardPickScheduledForResult(m)">
                  <div class="scheduled-shortcut-top">
                    <span class="scheduled-shortcut-rel" x-show="dateRelative(m.scheduledAt)" x-text="dateRelative(m.scheduledAt)"></span>
                    <span class="scheduled-shortcut-time" x-text="formatDate(m.scheduledAt)"></span>
                  </div>
                  <div class="scheduled-shortcut-vs">
                    <div class="ssvs-player">
                      <span class="avatar sm" :style="`--avatar-hue:${playerHue(m.p1)}`" x-text="initials(m.p1)"></span>
                      <span x-text="m.p1"></span>
                    </div>
                    <span class="ssvs-sep">vs</span>
                    <div class="ssvs-player right">
                      <span x-text="m.p2"></span>
                      <span class="avatar sm" :style="`--avatar-hue:${playerHue(m.p2)}`" x-text="initials(m.p2)"></span>
                    </div>
                  </div>
                </button>
              </template>
            </div>
            <div class="wizard-section-title">Или избери играч ръчно</div>
          </div>
        </template>
        <div class="player-grid">
          <template x-for="p in players" :key="p">
            <button class="player-btn" @click="wizardSelectA(p)">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(p)}`" x-text="initials(p)"></span>
              <span class="player-btn-name" x-text="p"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- STEP 2: Player B -->
      <div class="wizard-step" x-show="wizard.step === 2">
        <template x-if="wizardOpponents.length === 0">
          <div class="wizard-empty">
            <div class="empty-icon">✓</div>
            <h3>Няма свободни опоненти</h3>
            <p>Този играч вече е играл с всички!</p>
          </div>
        </template>
        <div class="player-grid">
          <template x-for="op in wizardOpponents" :key="op.name">
            <button class="player-btn" :class="{scheduled: op.scheduledAt}" @click="wizardSelectB(op.name)">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(op.name)}`" x-text="initials(op.name)"></span>
              <span class="player-btn-name" x-text="op.name"></span>
              <span class="player-btn-pill" x-show="op.scheduledAt" x-text="'📅 ' + formatDate(op.scheduledAt)"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- STEP 3 schedule: Calendar -->
      <div class="wizard-step" x-show="wizard.step === 3 && wizard.mode === 'schedule'">
        <div class="calendar">
          <div class="calendar-head">
            <button class="cal-nav" @click="calPrevMonth()">‹</button>
            <div class="cal-month" x-text="calendarMonthLabel"></div>
            <button class="cal-nav" @click="calNextMonth()">›</button>
          </div>
          <div class="calendar-weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span>
          </div>
          <div class="calendar-grid">
            <template x-for="d in calendarDays" :key="d.date">
              <button
                class="cal-day"
                :class="{
                  'cal-other': d.isOtherMonth,
                  'cal-past': d.isPast,
                  'cal-today': d.isToday,
                  'cal-has': d.hasMatches,
                  'cal-selected': wizard.date === d.date
                }"
                :disabled="d.isPast"
                @click="wizardSelectDate(d.date)"
                x-text="d.day"
              ></button>
            </template>
          </div>
        </div>
      </div>

      <!-- STEP 4 schedule: Time -->
      <div class="wizard-step" x-show="wizard.step === 4 && wizard.mode === 'schedule'">
        <div class="time-presets">
          <template x-for="t in timePresets" :key="t">
            <button class="time-btn" :class="{active: wizard.time === t}" @click="wizard.time = t" x-text="t"></button>
          </template>
        </div>
        <div class="time-custom">
          <label class="form-label">Друг час</label>
          <input type="time" x-model="wizard.time" class="form-input" />
        </div>
        <div class="wizard-confirm-card" x-show="wizard.date && wizard.time">
          <div class="wizard-confirm-text">
            <strong x-text="wizard.playerA"></strong> срещу <strong x-text="wizard.playerB"></strong>
            <br />
            <span x-text="wizardConfirmDateText"></span>
          </div>
        </div>
        <button class="btn-primary full big" @click="wizardConfirmSchedule()" :disabled="!wizard.time">
          ✓ Потвърди планирането
        </button>
      </div>

      <!-- STEP 3 result: Score -->
      <div class="wizard-step" x-show="wizard.step === 3 && wizard.mode === 'result'">
        <div class="score-options">
          <button class="score-btn" @click="wizardConfirmResult(2, 0)">
            <span class="score-num">2 : 0</span>
            <span class="score-who"><strong x-text="wizard.playerA"></strong> печели</span>
          </button>
          <button class="score-btn" @click="wizardConfirmResult(2, 1)">
            <span class="score-num">2 : 1</span>
            <span class="score-who"><strong x-text="wizard.playerA"></strong> печели</span>
          </button>
          <button class="score-btn" @click="wizardConfirmResult(1, 2)">
            <span class="score-num">1 : 2</span>
            <span class="score-who"><strong x-text="wizard.playerB"></strong> печели</span>
          </button>
          <button class="score-btn" @click="wizardConfirmResult(0, 2)">
            <span class="score-num">0 : 2</span>
            <span class="score-who"><strong x-text="wizard.playerB"></strong> печели</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== LIVE SCORING MODAL ===== -->
  <div class="modal-backdrop live-backdrop" x-show="liveMatch" @click.self="closeLive()" x-transition.opacity style="display:none">
    <div class="modal live-modal" x-show="liveMatch" x-transition>
      <template x-if="liveMatch">
        <div>
          <div class="modal-head">
            <button class="btn-close" @click="closeLive()">✕</button>
            <h3>
              <span class="live-dot"></span>
              На живо · #<span x-text="liveMatch.num"></span>
            </h3>
            <div style="width:36px"></div>
          </div>

          <!-- Sets summary -->
          <div class="live-sets-summary" x-show="liveDraft.sets.length > 0">
            <div class="live-sets-label">Изиграни сетове</div>
            <div class="live-sets-list">
              <template x-for="(s, i) in liveDraft.sets" :key="i">
                <div class="live-set-pill">
                  <span class="live-set-idx">Сет <span x-text="i+1"></span></span>
                  <span class="live-set-score" :class="{w1: s[0]>s[1], w2: s[1]>s[0]}">
                    <span x-text="s[0]"></span>:<span x-text="s[1]"></span>
                  </span>
                </div>
              </template>
            </div>
          </div>

          <!-- Players header (always visible) -->
          <div class="live-players">
            <div class="live-player-cell">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(liveMatch.p1)}`" x-text="initials(liveMatch.p1)"></span>
              <span class="live-player-name" x-text="liveMatch.p1"></span>
              <span class="live-sets-won" x-text="liveSetsWon(liveMatch)[0] + ' сета'"></span>
            </div>
            <div class="live-vs-sep">vs</div>
            <div class="live-player-cell">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(liveMatch.p2)}`" x-text="initials(liveMatch.p2)"></span>
              <span class="live-player-name" x-text="liveMatch.p2"></span>
              <span class="live-sets-won" x-text="liveSetsWon(liveMatch)[1] + ' сета'"></span>
            </div>
          </div>

          <!-- Current set / Tiebreak panel -->
          <div class="live-current">
            <div class="live-current-label">
              <template x-if="!liveDraft.tb">
                <span>Текущ сет — геймове</span>
              </template>
              <template x-if="liveDraft.tb">
                <span class="live-tb-label">⚡ TIEBREAK · първи до 7 (с 2 разлика)</span>
              </template>
            </div>

            <!-- Games scoreboard -->
            <template x-if="!liveDraft.tb">
              <div class="live-scoreboard">
                <div class="live-score-cell">
                  <button class="score-step minus" @click="liveSubPoint(0)" :disabled="liveDraft.cur[0] === 0">–</button>
                  <div class="live-score-num" x-text="liveDraft.cur[0]"></div>
                  <button class="score-step plus" @click="liveAddPoint(0)">+</button>
                </div>
                <div class="live-score-divider">:</div>
                <div class="live-score-cell">
                  <button class="score-step minus" @click="liveSubPoint(1)" :disabled="liveDraft.cur[1] === 0">–</button>
                  <div class="live-score-num" x-text="liveDraft.cur[1]"></div>
                  <button class="score-step plus" @click="liveAddPoint(1)">+</button>
                </div>
              </div>
            </template>

            <!-- Tiebreak scoreboard -->
            <template x-if="liveDraft.tb">
              <div class="live-scoreboard tb">
                <div class="live-score-cell">
                  <button class="score-step minus" @click="liveSubPoint(0)" :disabled="liveDraft.tb[0] === 0">–</button>
                  <div class="live-score-num" x-text="liveDraft.tb[0]"></div>
                  <button class="score-step plus" @click="liveAddPoint(0)">+</button>
                </div>
                <div class="live-score-divider">:</div>
                <div class="live-score-cell">
                  <button class="score-step minus" @click="liveSubPoint(1)" :disabled="liveDraft.tb[1] === 0">–</button>
                  <div class="live-score-num" x-text="liveDraft.tb[1]"></div>
                  <button class="score-step plus" @click="liveAddPoint(1)">+</button>
                </div>
              </div>
            </template>

            <!-- End-of-set button (games mode only) -->
            <template x-if="!liveDraft.tb">
              <button
                class="btn-primary full live-end-set"
                @click="liveEndCurrentSet()"
                :disabled="!liveCanEndSet()">
                <span x-show="liveCanEndSet()">
                  ✓ Завърши сета —
                  <strong x-text="(liveDraft.cur[0] > liveDraft.cur[1] ? liveMatch.p1 : liveMatch.p2)"></strong>
                  печели
                </span>
                <span x-show="!liveCanEndSet() && liveDraft.cur[0] === liveDraft.cur[1] && liveDraft.cur[0] === 0">
                  Натискай + след всеки гейм
                </span>
                <span x-show="!liveCanEndSet() && liveDraft.cur[0] === liveDraft.cur[1] && liveDraft.cur[0] > 0">
                  Равенство — играйте още
                </span>
              </button>
            </template>

            <!-- Cancel tiebreak button -->
            <template x-if="liveDraft.tb">
              <button class="btn-ghost full" @click="liveExitTiebreak()">
                ↩ Откажи tiebreak (върни към геймовете)
              </button>
            </template>
          </div>

          <!-- Status / errors -->
          <div class="live-status">
            <span x-show="livePending" class="status-saving">⟳ Запис...</span>
            <span x-show="!livePending && !liveError" class="status-saved">✓ Синхронизирано</span>
            <span x-show="liveError" class="status-error" x-text="liveError"></span>
          </div>

          <p class="live-hint">
            Когато един от играчите спечели <strong>2 сета</strong>, мачът се финализира автоматично.
          </p>
        </div>
      </template>
    </div>
  </div>

  <!-- ===== PLAYER PICKER MODAL ===== -->
  <div class="modal-backdrop" x-show="playerPicker.open" @click.self="closePlayerPicker()" x-transition.opacity style="display:none">
    <div class="modal" x-show="playerPicker.open" x-transition>
      <div class="modal-head">
        <button class="btn-close" @click="closePlayerPicker()">✕</button>
        <h3 x-text="playerPicker.title"></h3>
        <div style="width:36px"></div>
      </div>
      <button class="player-all-btn" x-show="playerPicker.showAll" @click="selectPickerPlayer('')">
        <span class="player-all-icon">👥</span>
        <span>Всички играчи</span>
      </button>
      <div class="player-grid">
        <template x-for="p in players" :key="p">
          <button class="player-btn" @click="selectPickerPlayer(p)">
            <span class="avatar lg" :style="`--avatar-hue:${playerHue(p)}`" x-text="initials(p)"></span>
            <span class="player-btn-name" x-text="p"></span>
            <span class="player-btn-stat" x-show="playedCountFor(p) > 0">
              <span x-text="playedCountFor(p)"></span><span class="stat-sep">/</span><span x-text="matchCountFor(p)"></span>
            </span>
          </button>
        </template>
      </div>
    </div>
  </div>
</body>
</html>
