<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e1c14" />
<title>Тенис Лига Велинград · Сезон 2026</title>
<meta name="description" content="Любителска тенис лига Велинград — всеки срещу всеки, до 2 спечелени сета. Live резултати в реално време." />

<!-- Open Graph / iMessage / Telegram / FB -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Тенис Лига Велинград" />
<meta property="og:title" content="Тенис Лига Велинград · Сезон 2026" />
<meta property="og:description" content="Всеки срещу всеки · до 2 спечелени сета · 20 играчи · live резултати" />
<meta property="og:url" content="https://tennis.unrealsoft.bg/" />
<meta property="og:image" content="https://tennis.unrealsoft.bg/og.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Тенис Лига Велинград — Сезон 2026" />
<meta property="og:locale" content="bg_BG" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Тенис Лига Велинград · Сезон 2026" />
<meta name="twitter:description" content="Всеки срещу всеки · до 2 спечелени сета · live резултати" />
<meta name="twitter:image" content="https://tennis.unrealsoft.bg/og.png" />

<!-- Icons -->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Тенис Велинград" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<script src="data.js"></script>
<script src="app.js"></script>
<script defer src="alpine.min.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    // Track whether there was already a controller at page load. If yes,
    // a future controllerchange means an update took over (banner-worthy).
    // If no, controllerchange is just first-install — don't pester the user.
    const hadControllerAtLoad = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadControllerAtLoad) {
        window.dispatchEvent(new CustomEvent('sw-update-available'));
      }
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(reg => {
        if (!reg) return;
        // Detect a SW that's already installed and ready (race: install finished
        // before this listener was attached). Trigger update banner immediately.
        if (reg.waiting && navigator.serviceWorker.controller) {
          window.dispatchEvent(new CustomEvent('sw-update-available'));
        }
        const watchInstalling = (sw) => {
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              window.dispatchEvent(new CustomEvent('sw-update-available'));
            }
          });
        };
        watchInstalling(reg.installing);
        reg.addEventListener('updatefound', () => watchInstalling(reg.installing));
        // Force a check now (in case the cached SW didn't already check on load)
        reg.update().catch(() => {});
        // Periodic update check for long-open sessions: every 15 min and
        // whenever the tab regains visibility (user comes back to it).
        setInterval(() => reg.update().catch(() => {}), 15 * 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
</head>
<body x-data="tennisApp" x-cloak>
  <!-- Toast (auto-refresh notifications) -->
  <div class="toast" x-show="toast" x-transition.opacity x-text="toast"></div>

  <!-- SW update available — persistent until user taps to reload -->
  <div class="sw-update-banner" x-show="swUpdateReady" @click="window.location.reload()" x-transition>
    ✨ Налична е нова версия — кликни за обнова
  </div>

  <!-- Push-notifications toggle. Hidden if browser doesn't support Web Push
       (e.g. iOS Safari outside of PWA mode). Single pill button with explicit
       text labels — "🔔 Включи известия" → "✓ Включени". The off state pulses
       gently for ~3s on first visit so users notice it exists. -->
  <button class="push-bell"
          x-show="push.supported"
          :class="{ subscribed: push.subscribed, denied: push.permission === 'denied', pending: push.pending }"
          :disabled="push.pending"
          @click="togglePush()"
          :title="push.permission === 'denied' ? 'Известията са блокирани в браузъра. Отблокирай от настройките на сайта.' : (push.subscribed ? 'Получаваш известия за мачовете. Кликни за спиране.' : 'Кликни за да получаваш известия за мачове на живо')"
          :aria-label="push.subscribed ? 'Спри известията' : 'Включи известията'"
          x-cloak>
    <template x-if="push.pending">
      <span class="push-bell-content">
        <span class="push-bell-icon">⏳</span>
        <span class="push-bell-label">Момент…</span>
      </span>
    </template>
    <template x-if="!push.pending && !push.subscribed && push.permission !== 'denied'">
      <span class="push-bell-content">
        <span class="push-bell-icon">🔔</span>
        <span class="push-bell-label">Включи известия</span>
      </span>
    </template>
    <template x-if="!push.pending && push.subscribed">
      <span class="push-bell-content">
        <span class="push-bell-icon">✓</span>
        <span class="push-bell-label">Известията са ВКЛ</span>
      </span>
    </template>
    <template x-if="!push.pending && push.permission === 'denied'">
      <span class="push-bell-content">
        <span class="push-bell-icon">🚫</span>
        <span class="push-bell-label">Блокирани</span>
      </span>
    </template>
  </button>

  <!-- HERO (compact, only on standings) -->
  <header class="hero hero-compact" x-show="view === 'standings'">
    <h1 class="hero-title">
      <span class="line-1">Тенис Лига</span>
      <span class="line-2">Велинград</span>
    </h1>
    <!-- Tournament-progress bar — replaces the previous 4-metric stats line.
         The dominant question on a hobby league's home page is "how far along
         are we?" — answer it visually + numerically in one strip. -->
    <div class="tournament-progress" :title="playedMatches.length + ' изиграни от ' + matches.length + ' мача'">
      <div class="tp-bar">
        <div class="tp-bar-fill" :style="`width: ${matches.length ? Math.round(playedMatches.length / matches.length * 100) : 0}%`"></div>
      </div>
      <div class="tp-meta">
        <span class="tp-pct" x-text="(matches.length ? Math.round(playedMatches.length / matches.length * 100) : 0) + '%'"></span>
        <span class="tp-frac"><span x-text="playedMatches.length"></span> от <span x-text="matches.length"></span> мача</span>
      </div>
    </div>
  </header>

  <main>

    <!-- ===== STANDINGS ===== -->
    <section class="panel" x-show="view === 'standings'">
      <!-- Live banner — big card per active live match -->
      <template x-if="liveMatchesList.length > 0">
        <div class="live-banner-big">
          <div class="live-banner-head">
            <span class="live-dot"></span>
            <span>На живо в момента</span>
          </div>
          <template x-for="m in liveMatchesList" :key="m.key">
            <div class="live-card" @click="openLive(m)">
              <div class="live-card-vs">
                <div class="live-card-player">
                  <span class="avatar xl" :style="`--avatar-hue:${playerHue(m.p1)}`" x-text="initials(m.p1)"></span>
                  <span class="live-card-name" x-text="m.p1"></span>
                  <span class="live-card-sets" x-text="liveSetsWon(m)[0] + ' сета'"></span>
                </div>
                <div class="live-card-score-block">
                  <div class="live-card-current">
                    <span class="live-card-num" :class="{lead: liveOf(m) && liveOf(m).cur && liveOf(m).cur[0] > liveOf(m).cur[1]}" x-text="liveOf(m) && liveOf(m).cur ? liveOf(m).cur[0] : 0"></span>
                    <span class="live-card-colon">:</span>
                    <span class="live-card-num" :class="{lead: liveOf(m) && liveOf(m).cur && liveOf(m).cur[1] > liveOf(m).cur[0]}" x-text="liveOf(m) && liveOf(m).cur ? liveOf(m).cur[1] : 0"></span>
                  </div>
                  <template x-if="liveOf(m) && liveOf(m).sets && liveOf(m).sets.length > 0">
                    <div class="live-card-sets-strip">
                      <template x-for="(s, i) in liveOf(m).sets" :key="i">
                        <span class="live-card-set">
                          <span class="live-card-set-idx" x-text="i+1"></span>
                          <span class="live-card-set-num" :class="{won: s[0]>s[1]}" x-text="s[0]"></span>
                          <span class="live-card-set-mid">:</span>
                          <span class="live-card-set-num" :class="{won: s[1]>s[0]}" x-text="s[1]"></span>
                        </span>
                      </template>
                    </div>
                  </template>
                  <template x-if="liveOf(m) && liveOf(m).tb">
                    <div class="live-card-tb">
                      ⚡ TB <span x-text="liveOf(m).tb[0]"></span>:<span x-text="liveOf(m).tb[1]"></span>
                    </div>
                  </template>
                </div>
                <div class="live-card-player">
                  <span class="avatar xl" :style="`--avatar-hue:${playerHue(m.p2)}`" x-text="initials(m.p2)"></span>
                  <span class="live-card-name" x-text="m.p2"></span>
                  <span class="live-card-sets" x-text="liveSetsWon(m)[1] + ' сета'"></span>
                </div>
              </div>
              <div class="live-card-cta">
                <span class="live-dot"></span>
                <span>Кликни за да въведеш геймове</span>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Should-be-live: scheduled today, time has passed, not started yet -->
      <template x-if="matchesShouldBeLive.length > 0">
        <div class="live-banner-big start-now-banner">
          <div class="live-banner-head start-now-head">
            <span class="start-now-icon">⏰</span>
            <span>Време е за тези мачове</span>
          </div>
          <template x-for="m in matchesShouldBeLive" :key="m.key">
            <div class="live-card start-now-card" @click="openLive(m)">
              <div class="live-card-vs">
                <div class="live-card-player">
                  <span class="avatar xl" :style="`--avatar-hue:${playerHue(m.p1)}`" x-text="initials(m.p1)"></span>
                  <span class="live-card-name" x-text="m.p1"></span>
                </div>
                <div class="live-card-score-block">
                  <div class="start-now-time" x-text="m.scheduledAt.slice(11,16)"></div>
                  <div class="start-now-rel" x-text="timeFromNow(m.scheduledAt)"></div>
                </div>
                <div class="live-card-player">
                  <span class="avatar xl" :style="`--avatar-hue:${playerHue(m.p2)}`" x-text="initials(m.p2)"></span>
                  <span class="live-card-name" x-text="m.p2"></span>
                </div>
              </div>
              <div class="live-card-cta start-now-cta">
                <span>⚡</span>
                <span>Кликни за да започнеш на живо</span>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Podium — only when there's at least one played match. Compact
           variant with W-L record + match-completion progress alongside name. -->
      <template x-if="standings[0] && standings[0].played > 0">
        <div class="podium">
          <template x-if="standings[1]">
            <div class="podium-spot p2" @click="jumpToPlayer(standings[1].name)">
              <div class="podium-medal">🥈</div>
              <div class="avatar lg" :style="`--avatar-hue:${playerHue(standings[1].name)}`" x-text="initials(standings[1].name)"></div>
              <div class="podium-name" x-text="standings[1].name"></div>
              <div class="podium-stats">
                <span class="wl-w" x-text="standings[1].wins"></span>–<span class="wl-l" x-text="standings[1].losses"></span>
                <span class="podium-progress" x-text="duelProgressLabel(standings[1])"></span>
              </div>
            </div>
          </template>
          <div class="podium-spot p1" @click="jumpToPlayer(standings[0].name)">
            <div class="podium-crown">👑</div>
            <div class="podium-medal">🥇</div>
            <div class="avatar xl" :style="`--avatar-hue:${playerHue(standings[0].name)}`" x-text="initials(standings[0].name)"></div>
            <div class="podium-name" x-text="standings[0].name"></div>
            <div class="podium-stats">
              <span class="wl-w" x-text="standings[0].wins"></span>–<span class="wl-l" x-text="standings[0].losses"></span>
              <span class="podium-progress" x-text="duelProgressLabel(standings[0])"></span>
            </div>
          </div>
          <template x-if="standings[2]">
            <div class="podium-spot p3" @click="jumpToPlayer(standings[2].name)">
              <div class="podium-medal">🥉</div>
              <div class="avatar lg" :style="`--avatar-hue:${playerHue(standings[2].name)}`" x-text="initials(standings[2].name)"></div>
              <div class="podium-name" x-text="standings[2].name"></div>
              <div class="podium-stats">
                <span class="wl-w" x-text="standings[2].wins"></span>–<span class="wl-l" x-text="standings[2].losses"></span>
                <span class="podium-progress" x-text="duelProgressLabel(standings[2])"></span>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Recent results — placed BEFORE the standings because users open
           the home page mostly to check "what just happened?". Open by
           default; collapse via the disclosure if you want to skip it. -->
      <template x-if="recentResults.length > 0">
        <details class="recent-section" open>
          <summary class="recent-section-head">
            <span class="rs-icon">🏆</span>
            <span class="rs-title">Последни резултати</span>
            <span class="rs-count" x-text="recentResults.length"></span>
            <span class="rs-chevron">▾</span>
          </summary>
          <div class="recent-section-body">
            <template x-for="g in recentResultsByDate" :key="g.label || '_flat'">
              <div class="rr-group">
                <template x-if="g.label">
                  <div class="rr-date-sep" x-text="g.label"></div>
                </template>
                <template x-for="r in g.items" :key="r.key">
                  <div class="recent-line" @click="jumpToPlayer(r.match.winner)">
                    <span class="rl-winner" x-text="r.match.winner"></span>
                    <span class="rl-score" x-text="(r.match.winner === r.match.p1 ? r.match.s1 : r.match.s2) + ':' + (r.match.winner === r.match.p1 ? r.match.s2 : r.match.s1)"></span>
                    <span class="rl-loser" x-text="r.match.winner === r.match.p1 ? r.match.p2 : r.match.p1"></span>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </details>
      </template>

      <div class="panel-head panel-head-compact">
        <h2>Класиране</h2>
        <p><em>Кликни играч за подробности</em></p>
      </div>

      <!-- Search bar — only useful when the list gets long. -->
      <template x-if="players.length > 8">
        <div class="standings-search">
          <input type="search" x-model="duelSearch" placeholder="🔍 Намери играч..." />
          <button class="duels-search-clear" x-show="duelSearch" @click="duelSearch=''" aria-label="Изчисти">✕</button>
        </div>
      </template>

      <!-- Active players (have ≥1 played match). Top-3 get medal accents. -->
      <div class="standings-list">
        <template x-for="(s, i) in standingsActive" :key="s.name">
          <div class="standings-row"
               :class="{['podium-' + (i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '')]: i < 3}"
               @click="jumpToPlayer(s.name)">
            <span class="sr-rank" x-text="s.rank"></span>
            <span class="avatar sm" :style="`--avatar-hue:${playerHue(s.name)}`" x-text="initials(s.name)"></span>
            <div class="sr-info">
              <span class="sr-name" x-text="s.name"></span>
              <span class="sr-meta">
                <span class="wl-w" x-text="s.wins"></span>–<span class="wl-l" x-text="s.losses"></span>
                <span class="sr-meta-sep">·</span>
                <span class="sr-sets"><span x-text="s.setsWon"></span>:<span x-text="s.setsLost"></span></span>
                <span class="sr-meta-sep">·</span>
                <span class="sr-progress" x-text="duelProgressLabel(s)"></span>
              </span>
            </div>
            <span class="sr-points">
              <span class="sr-points-val" x-text="s.wins"></span>
              <span class="sr-points-label">Поб.</span>
            </span>
            <span class="sr-chev">›</span>
          </div>
        </template>
      </div>

      <!-- Inactive players (0 played) — collapsed-style separator + dim rows. -->
      <template x-if="standingsInactive.length > 0">
        <div class="standings-inactive">
          <div class="standings-sep">
            <span class="ss-line"></span>
            <span class="ss-label">Без мачове · <span x-text="standingsInactive.length"></span></span>
            <span class="ss-line"></span>
          </div>
          <template x-for="s in standingsInactive" :key="s.name">
            <div class="standings-row dim" @click="jumpToPlayer(s.name)">
              <span class="sr-rank">—</span>
              <span class="avatar sm" :style="`--avatar-hue:${playerHue(s.name)}`" x-text="initials(s.name)"></span>
              <div class="sr-info">
                <span class="sr-name" x-text="s.name"></span>
                <span class="sr-meta">няма мачове</span>
              </div>
              <span class="sr-chev">›</span>
            </div>
          </template>
        </div>
      </template>

      <!-- Empty search results -->
      <div class="duels-empty" x-show="duelSearch && standingsActive.length === 0 && standingsInactive.length === 0">
        Няма играч с име "<span x-text="duelSearch"></span>"
      </div>
    </section>

    <!-- ===== UPCOMING ===== -->
    <section class="panel" x-show="view === 'upcoming'">
      <div class="panel-head">
        <h2>Предстоящи</h2>
        <p>Планирани мачове по дата</p>
      </div>
      <template x-if="activeScheduledMatches.length === 0">
        <div class="empty-state">
          <div class="empty-icon">📅</div>
          <h3>Няма планирани мачове</h3>
          <p>Админът може да планира мачове от админ панела.</p>
        </div>
      </template>
      <template x-for="g in upcomingGroups" :key="g.key">
        <div class="upcoming-group" :class="{ hero: g.hero }">
          <h3 class="upcoming-group-head">
            <span class="ug-icon" x-text="g.icon"></span>
            <span class="ug-title" x-text="g.title"></span>
            <span class="ug-count" x-text="g.items.length"></span>
          </h3>
          <div class="upcoming-list">
            <template x-for="m in g.items" :key="m.key">
              <div class="upcoming-card" :class="{'is-today': isMatchToday(m), 'is-live': isMatchLive(m), 'is-hero': g.hero}">
                <div class="upcoming-date-row">
                  <div class="upcoming-date" x-text="formatDateLong(m.scheduledAt)"></div>
                  <span class="upcoming-when-pill" x-show="dateRelative(m.scheduledAt)" x-text="dateRelative(m.scheduledAt)"></span>
                </div>
                <!-- Countdown shown only on the hero (today) card — that's
                     where minute-level precision matters. Other groups have
                     the relative pill ("УТРЕ", "СЛЕД 4 ДНИ") which is enough. -->
                <div class="upcoming-countdown" x-show="g.hero && countdownTo(m.scheduledAt)" x-text="countdownTo(m.scheduledAt)"></div>
                <div class="upcoming-vs">
                  <div class="upcoming-player" @click="jumpToPlayer(m.p1)">
                    <span class="avatar lg" :style="`--avatar-hue:${playerHue(m.p1)}`" x-text="initials(m.p1)"></span>
                    <span class="upcoming-name" x-text="m.p1"></span>
                  </div>
                  <div class="upcoming-vs-sep">VS</div>
                  <div class="upcoming-player right" @click="jumpToPlayer(m.p2)">
                    <span class="avatar lg" :style="`--avatar-hue:${playerHue(m.p2)}`" x-text="initials(m.p2)"></span>
                    <span class="upcoming-name" x-text="m.p2"></span>
                  </div>
                </div>
                <template x-if="isMatchLive(m)">
                  <div class="live-strip" @click="openLive(m)">
                    <span class="live-dot"></span>
                    <span class="live-label">НА ЖИВО</span>
                    <span class="live-score" x-text="formatLiveScore(m)"></span>
                    <span class="live-arrow">→</span>
                  </div>
                </template>
                <template x-if="canWriteToday(m) && !isMatchLive(m)">
                  <div class="today-actions">
                    <button class="btn-live" @click="openLive(m)">🔴 На живо</button>
                    <button class="btn-final" @click="openScore(m)">🏁 Краен резултат</button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- ===== MATCHES ===== -->
    <!-- ===== ДВУБОИ (H2H) ===== -->
    <template x-if="view === 'grid'">
    <section class="panel">
      <div class="panel-head">
        <h2>Двубои</h2>
        <p>Подредени по точки · кликни играч за двубоите му</p>
      </div>

      <!-- Search bar — only when there are enough players to make scrolling
           a problem. Below 9 players the list fits on a phone screen. -->
      <template x-if="players.length > 8">
        <div class="duels-search">
          <input type="search" x-model="duelSearch" placeholder="🔍 Намери играч..." />
          <button class="duels-search-clear" x-show="duelSearch" @click="duelSearch=''" aria-label="Изчисти">✕</button>
        </div>
      </template>

      <!-- MOBILE: vertical expandable cards, sorted by standings -->
      <div class="duels-mobile">
        <template x-for="s in duelsList" :key="s.name">
          <div class="duel-card-v2"
               :class="{
                 open: duelExpanded === s.name,
                 dim: !s.played,
                 ['podium-' + duelPodium(s, s.rank - 1)]: duelPodium(s, s.rank - 1)
               }">
            <button class="duel-card-head-v2" @click="duelExpanded = duelExpanded === s.name ? null : s.name">
              <span class="duel-rank" :class="{invisible: !s.played}" x-text="s.played ? s.rank : ''"></span>
              <span class="avatar sm" :style="`--avatar-hue:${playerHue(s.name)}`" x-text="initials(s.name)"></span>
              <div class="duel-card-info-v2">
                <span class="duel-card-name-v2" x-text="s.name"></span>
                <span class="duel-card-meta">
                  <span class="wl-w" x-text="s.wins"></span><span class="wl-sep">–</span><span class="wl-l" x-text="s.losses"></span>
                  <span class="duel-meta-sep" x-show="s.played">·</span>
                  <span class="duel-card-points" x-show="s.played" x-text="s.points + ' т.'"></span>
                  <span class="duel-card-empty" x-show="!s.played">няма мачове</span>
                </span>
              </div>
              <div class="duel-progress" :title="'Изиграни ' + duelProgressLabel(s) + ' мача'">
                <div class="duel-progress-fill" :style="`width: ${duelProgressRate(s) * 100}%`"></div>
                <span class="duel-progress-label" x-text="duelProgressLabel(s)"></span>
              </div>
              <span class="duel-card-arrow-v2" x-text="duelExpanded === s.name ? '▴' : '▾'"></span>
            </button>
            <div class="duel-card-body-v2" x-show="duelExpanded === s.name" x-transition.duration.200ms>
              <!-- Sticky mini-header with selected player while scrolling -->
              <div class="duel-sticky-head">
                <span class="avatar sm" :style="`--avatar-hue:${playerHue(s.name)}`" x-text="initials(s.name)"></span>
                <span x-text="s.name"></span>
                <span class="duel-sticky-meta">
                  <span class="wl-w" x-text="s.wins"></span>–<span class="wl-l" x-text="s.losses"></span>
                </span>
              </div>

              <!-- Wins -->
              <template x-if="duelOpponentsGrouped(s.name).wins.length > 0">
                <div class="duel-group">
                  <div class="duel-group-head wins">
                    <span class="dg-icon">✓</span>
                    <span class="dg-label">Победи</span>
                    <span class="dg-count" x-text="duelOpponentsGrouped(s.name).wins.length"></span>
                  </div>
                  <template x-for="op in duelOpponentsGrouped(s.name).wins" :key="'w-' + op">
                    <div class="duel-row-v2 win" @click="jumpToPlayer(op)">
                      <span class="avatar sm" :style="`--avatar-hue:${playerHue(op)}`" x-text="initials(op)"></span>
                      <div class="duel-row-info">
                        <span class="duel-row-name" x-text="op"></span>
                        <span class="duel-row-sub" x-show="duelRowSubline(s.name, op)" x-text="duelRowSubline(s.name, op)"></span>
                      </div>
                      <span class="duel-row-result-v2" x-text="duelRowText(s.name, op)"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Losses -->
              <template x-if="duelOpponentsGrouped(s.name).losses.length > 0">
                <div class="duel-group">
                  <div class="duel-group-head losses">
                    <span class="dg-icon">✗</span>
                    <span class="dg-label">Загуби</span>
                    <span class="dg-count" x-text="duelOpponentsGrouped(s.name).losses.length"></span>
                  </div>
                  <template x-for="op in duelOpponentsGrouped(s.name).losses" :key="'l-' + op">
                    <div class="duel-row-v2 loss" @click="jumpToPlayer(op)">
                      <span class="avatar sm" :style="`--avatar-hue:${playerHue(op)}`" x-text="initials(op)"></span>
                      <div class="duel-row-info">
                        <span class="duel-row-name" x-text="op"></span>
                        <span class="duel-row-sub" x-show="duelRowSubline(s.name, op)" x-text="duelRowSubline(s.name, op)"></span>
                      </div>
                      <span class="duel-row-result-v2" x-text="duelRowText(s.name, op)"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Scheduled -->
              <template x-if="duelOpponentsGrouped(s.name).scheduled.length > 0">
                <div class="duel-group">
                  <div class="duel-group-head scheduled">
                    <span class="dg-icon">🕐</span>
                    <span class="dg-label">Предстоящи</span>
                    <span class="dg-count" x-text="duelOpponentsGrouped(s.name).scheduled.length"></span>
                  </div>
                  <template x-for="op in duelOpponentsGrouped(s.name).scheduled" :key="'s-' + op">
                    <div class="duel-row-v2 scheduled">
                      <span class="avatar sm" :style="`--avatar-hue:${playerHue(op)}`" x-text="initials(op)"></span>
                      <div class="duel-row-info" @click="jumpToPlayer(op)">
                        <span class="duel-row-name" x-text="op"></span>
                        <span class="duel-row-sub" x-show="duelRowSubline(s.name, op)" x-text="duelRowSubline(s.name, op)"></span>
                      </div>
                      <template x-if="!duelCanWriteToday(s.name, op)">
                        <span class="duel-row-result-v2" x-text="duelRowText(s.name, op)"></span>
                      </template>
                      <template x-if="duelCanWriteToday(s.name, op)">
                        <button class="duel-row-cta" @click.stop="openLive(duelMatchOf(s.name, op))" title="Започни на живо">
                          ▶ <span class="duel-cta-label">На живо</span>
                        </button>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

              <!-- Pending — collapsed by default since it's usually most rows
                   and least informative on a mature tournament. -->
              <template x-if="duelOpponentsGrouped(s.name).pending.length > 0">
                <div class="duel-group">
                  <button class="duel-group-head pending toggle"
                          @click.stop="duelPendingExpanded[s.name] = !duelPendingExpanded[s.name]">
                    <span class="dg-icon">⚪</span>
                    <span class="dg-label">Неизиграни</span>
                    <span class="dg-count" x-text="duelOpponentsGrouped(s.name).pending.length"></span>
                    <span class="dg-chevron" x-text="duelPendingExpanded[s.name] ? '▴' : '▾'"></span>
                  </button>
                  <div x-show="duelPendingExpanded[s.name]" x-transition.duration.150ms>
                    <template x-for="op in duelOpponentsGrouped(s.name).pending" :key="'p-' + op">
                      <div class="duel-row-v2 pending" @click="jumpToPlayer(op)">
                        <span class="avatar sm" :style="`--avatar-hue:${playerHue(op)}`" x-text="initials(op)"></span>
                        <span class="duel-row-name" x-text="op"></span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Empty state when search yields nothing -->
        <div class="duels-empty" x-show="duelSearch && duelsList.length === 0">
          Няма играч с име "<span x-text="duelSearch"></span>"
        </div>
      </div>

    </section>
    </template>

    <!-- ===== ADMIN ===== -->
    <template x-if="view === 'admin'">
    <section class="panel">
      <template x-if="!isAdmin">
        <div class="admin-locked">
          <div class="lock-icon">🔒</div>
          <h2 x-text="needsPasswordSetup ? 'Първоначално настройване' : 'Заключено'"></h2>
          <p x-text="needsPasswordSetup ? 'Задай нова парола за админ достъп' : 'Въведи администраторска парола'"></p>
          <form @submit.prevent="submitPassword($el)" class="login-form" method="post" action="#">
            <!-- Hidden username field — password managers (Chrome, Safari, 1Password)
                 typically refuse to save credentials without an associated username.
                 We have a single shared admin so the value is constant. -->
            <input type="text" name="username" value="admin" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true" readonly />
            <input
              type="password"
              name="password"
              id="admin-password"
              x-model="passwordInput"
              placeholder="Парола"
              :autocomplete="needsPasswordSetup ? 'new-password' : 'current-password'"
              required
            />
            <button type="submit" class="btn-primary full" x-text="needsPasswordSetup ? 'Задай парола' : 'Влез'"></button>
            <p class="error" x-show="passwordError" x-text="passwordError"></p>
          </form>
          <button type="button" class="admin-locked-refresh" @click="hardRefresh()">
            ↻ Презареди (изчисти кеша)
          </button>
        </div>
      </template>

      <template x-if="isAdmin">
        <div class="admin-panel-v2">
          <!-- Compact head: just save status + overflow menu -->
          <div class="admin-head-v2">
            <div class="admin-status-mini" :class="{busy: saveStatus === 'saving', error: saveStatus === 'error'}">
              <span class="dot"></span>
              <span x-show="!saveStatus">Активен</span>
              <span x-show="saveStatus === 'saving'">Запис…</span>
              <span x-show="saveStatus === 'saved'">✓ Запазено</span>
              <span x-show="saveStatus === 'error'">✕ Грешка</span>
            </div>
            <button class="btn-icon admin-menu-trigger" @click="adminMenuOpen = true" aria-label="Меню">⋯</button>
          </div>

          <!-- TODAY hero -->
          <template x-if="adminHasTodayContent">
            <div class="admin-today">
              <div class="today-label" x-text="adminTodayLabel"></div>
              <!-- Live now -->
              <template x-for="m in liveMatchesList" :key="'live-' + m.key">
                <div class="today-card live-now">
                  <div class="today-card-status"><span class="live-dot"></span> На живо <span x-text="formatLiveScore(m)"></span></div>
                  <div class="today-card-vs">
                    <span x-text="m.p1"></span>
                    <span class="vs">vs</span>
                    <span x-text="m.p2"></span>
                  </div>
                  <div class="today-card-actions">
                    <button class="btn-primary today-cta" @click="openLive(m)">▶ Продължи на живо</button>
                    <button class="btn-icon today-more" @click="openMatchActions(m)" aria-label="Още">⋯</button>
                  </div>
                </div>
              </template>
              <!-- Should be live (scheduled time passed, no live data) -->
              <template x-for="m in matchesShouldBeLive" :key="'overdue-' + m.key">
                <div class="today-card overdue">
                  <div class="today-card-status">⏰ Време е · <span x-text="formatDate(m.scheduledAt)"></span></div>
                  <div class="today-card-vs">
                    <span x-text="m.p1"></span>
                    <span class="vs">vs</span>
                    <span x-text="m.p2"></span>
                  </div>
                  <div class="today-card-actions">
                    <button class="btn-primary today-cta" @click="openLive(m)">▶ Започни</button>
                    <button class="btn-icon today-more" @click="openMatchActions(m)" aria-label="Още">⋯</button>
                  </div>
                </div>
              </template>
              <!-- Today scheduled (future hours) -->
              <template x-for="m in todaysMatches" :key="'today-' + m.key">
                <div class="today-card upcoming">
                  <div class="today-card-status">🕐 <span x-text="formatDate(m.scheduledAt)"></span></div>
                  <div class="today-card-vs">
                    <span x-text="m.p1"></span>
                    <span class="vs">vs</span>
                    <span x-text="m.p2"></span>
                  </div>
                  <div class="today-card-actions">
                    <button class="btn-primary today-cta" @click="openLive(m)">▶ На живо</button>
                    <button class="btn-icon today-more" @click="openMatchActions(m)" aria-label="Още">⋯</button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Empty state when no today content -->
          <template x-if="!adminHasTodayContent">
            <div class="admin-empty-today">
              <div class="empty-today-icon">🎾</div>
              <p class="empty-today-msg">Няма мач днес</p>
              <button class="btn-primary" @click="openWizard('schedule')">+ Планирай мач</button>
            </div>
          </template>

          <!-- Plan-new-match CTA (always visible when there IS a today match too,
               so admin can quickly schedule another) -->
          <template x-if="adminHasTodayContent">
            <button class="admin-plan-cta" @click="openWizard('schedule')">
              <span>+ Планирай нов мач</span>
            </button>
          </template>

          <!-- Future matches section (collapsible) -->
          <template x-if="adminFutureMatches.length > 0">
            <div class="admin-section">
              <button class="admin-section-head" @click="adminFutureExpanded = !adminFutureExpanded" :aria-expanded="adminFutureExpanded">
                <span class="section-icon">📅</span>
                <span class="section-title">Бъдещи мачове</span>
                <span class="section-count" x-text="adminFutureMatches.length"></span>
                <span class="section-chevron" x-text="adminFutureExpanded ? '▾' : '▸'"></span>
              </button>
              <div class="admin-section-body" x-show="adminFutureExpanded" x-transition>
                <template x-for="m in adminFutureMatches" :key="m.key">
                  <div class="admin-match-v2 scheduled">
                    <div class="admin-match-v2-info">
                      <div class="match-time" x-text="formatDate(m.scheduledAt)"></div>
                      <div class="match-vs">
                        <span x-text="m.p1"></span>
                        <span class="vs">vs</span>
                        <span x-text="m.p2"></span>
                      </div>
                    </div>
                    <button class="btn-primary match-primary" @click="primaryActionFor(m).handler()">
                      <span x-text="primaryActionFor(m).icon"></span>
                      <span x-text="primaryActionFor(m).label"></span>
                    </button>
                    <button class="btn-icon match-more" @click="openMatchActions(m)" aria-label="Още">⋯</button>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Played matches section (collapsible, grouped by date) -->
          <template x-if="adminPlayedByDate.length > 0">
            <div class="admin-section">
              <button class="admin-section-head" @click="adminPlayedExpanded = !adminPlayedExpanded" :aria-expanded="adminPlayedExpanded">
                <span class="section-icon">✓</span>
                <span class="section-title">Изиграни</span>
                <span class="section-count" x-text="playedMatches.length"></span>
                <span class="section-chevron" x-text="adminPlayedExpanded ? '▾' : '▸'"></span>
              </button>
              <div class="admin-section-body" x-show="adminPlayedExpanded" x-transition>
                <template x-for="g in adminPlayedByDate" :key="g.label">
                  <div class="admin-list-group">
                    <div class="admin-date-sep" x-text="g.label"></div>
                    <template x-for="m in g.items" :key="m.key">
                      <div class="admin-match-v2 played">
                        <div class="admin-match-v2-info">
                          <div class="match-vs played-vs">
                            <span :class="{strong: m.winner===m.p1}" x-text="m.p1"></span>
                            <span class="match-score" x-text="m.s1 + ':' + m.s2"></span>
                            <span :class="{strong: m.winner===m.p2}" x-text="m.p2"></span>
                          </div>
                        </div>
                        <button class="btn-ghost match-primary" @click="openScore(m)">
                          <span>✎</span><span>Редактирай</span>
                        </button>
                        <button class="btn-icon match-more" @click="openMatchActions(m)" aria-label="Още">⋯</button>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- ===== Admin overflow menu ===== -->
          <div class="admin-menu-backdrop" x-show="adminMenuOpen" @click="adminMenuOpen=false" x-transition.opacity style="display:none"></div>
          <div class="admin-menu-sheet" x-show="adminMenuOpen" x-transition style="display:none">
            <div class="admin-menu-handle"></div>
            <button class="admin-menu-item" @click="adminMenuOpen=false; openWizard('schedule')">
              <span class="mi-icon">📅</span><span class="mi-label">Планирай мач</span>
            </button>
            <button class="admin-menu-item" @click="adminMenuOpen=false; openWizard('result')">
              <span class="mi-icon">🎾</span><span class="mi-label">Запиши резултат</span>
            </button>
            <button class="admin-menu-item" @click="adminMenuOpen=false; adminPlayersOpen=true">
              <span class="mi-icon">👤</span><span class="mi-label">Играчи</span>
              <span class="mi-meta" x-text="players.length"></span>
            </button>
            <hr class="admin-menu-sep" />
            <button class="admin-menu-item" @click="adminMenuOpen=false; exportData()">
              <span class="mi-icon">⬇</span><span class="mi-label">Експорт</span>
            </button>
            <!-- Импорт е скрит временно — твърде лесно се натиска по грешка
                 и презаписва цялата база. Да се върне с потвърждение. -->
            <button class="admin-menu-item" @click="adminMenuOpen=false; hardRefresh()">
              <span class="mi-icon">↻</span><span class="mi-label">Презареди</span>
            </button>
            <hr class="admin-menu-sep" />
            <button class="admin-menu-item" @click="adminAboutOpen=true">
              <span class="mi-icon">ℹ</span><span class="mi-label">За приложението</span>
            </button>
            <button class="admin-menu-item danger" @click="adminMenuOpen=false; logout()">
              <span class="mi-icon">↩</span><span class="mi-label">Изход</span>
            </button>
          </div>

          <!-- ===== About sheet ===== -->
          <div class="admin-menu-backdrop" x-show="adminAboutOpen" @click="adminAboutOpen=false" x-transition.opacity style="display:none"></div>
          <div class="admin-about-sheet" x-show="adminAboutOpen" x-transition style="display:none">
            <div class="admin-menu-handle"></div>
            <h3>За приложението</h3>
            <dl class="admin-about-grid">
              <dt>Режим</dt>
              <dd x-text="backendMode === 'api' ? 'Сървър' : 'Локално'"></dd>
              <dt>Версия</dt>
              <dd class="mono" x-text="appVersion || '—'"></dd>
              <dt>Играчи</dt>
              <dd x-text="players.length"></dd>
              <dt>Изиграни</dt>
              <dd x-text="playedMatches.length"></dd>
              <dt>Планирани</dt>
              <dd x-text="activeScheduledMatches.length"></dd>
            </dl>
            <button class="btn-ghost full" @click="adminAboutOpen=false">Затвори</button>
          </div>

          <!-- ===== Players drawer (full-width sheet) ===== -->
          <div class="admin-menu-backdrop" x-show="adminPlayersOpen" @click="adminPlayersOpen=false; cancelEditPlayer()" x-transition.opacity style="display:none"></div>
          <div class="admin-players-drawer" x-show="adminPlayersOpen" x-transition style="display:none">
            <div class="drawer-head">
              <h3>Играчи <span class="drawer-count" x-text="players.length"></span></h3>
              <button class="btn-icon" @click="adminPlayersOpen=false; cancelEditPlayer()" aria-label="Затвори">✕</button>
            </div>

            <!-- Add player form: input dominates, button is icon-only (compact). -->
            <form class="add-player-form" @submit.prevent="
              const res = await addPlayer(newPlayerName);
              if (res.ok) { newPlayerName = ''; addPlayerError = ''; }
              else addPlayerError = res.error;
            ">
              <input type="text" x-model="newPlayerName" placeholder="Добави нов играч…" maxlength="40" required />
              <button type="submit" class="add-player-submit" :disabled="!newPlayerName.trim()" aria-label="Добави">+</button>
            </form>
            <p class="add-player-error" x-show="addPlayerError" x-text="addPlayerError"></p>

            <!-- Search — only when many players. -->
            <template x-if="players.length > 8">
              <div class="players-search">
                <input type="search" x-model="playerSearch" placeholder="🔍 Намери играч..." />
                <button class="duels-search-clear" x-show="playerSearch" @click="playerSearch=''" aria-label="Изчисти">✕</button>
              </div>
            </template>

            <!-- Active players section -->
            <template x-if="adminPlayersGrouped.active.length > 0">
              <div class="players-section">
                <div class="players-section-head">
                  <span>Активни</span>
                  <span class="ps-count" x-text="adminPlayersGrouped.active.length"></span>
                </div>
                <template x-for="s in adminPlayersGrouped.active" :key="'a-' + s.name">
                  <div class="player-row" :class="{editing: playerEditing === s.name}">
                    <span class="avatar sm" :style="`--avatar-hue:${playerHue(s.name)}`" x-text="initials(s.name)"></span>
                    <!-- Display mode -->
                    <template x-if="playerEditing !== s.name">
                      <div class="player-row-info">
                        <span class="player-row-name" x-text="s.name"></span>
                        <span class="player-row-meta">
                          <span class="wl-w" x-text="s.wins"></span>–<span class="wl-l" x-text="s.losses"></span>
                          <span class="meta-sep">·</span>
                          <span x-text="s.played + ' мача'"></span>
                        </span>
                      </div>
                    </template>
                    <!-- Edit mode -->
                    <template x-if="playerEditing === s.name">
                      <form class="player-row-edit" @submit.prevent="saveEditPlayer()">
                        <input type="text" x-model="playerEditValue" maxlength="40"
                               @keydown.escape.prevent="cancelEditPlayer()" />
                        <button type="submit" class="row-icon-btn save" :disabled="!playerEditValue.trim() || playerEditValue.trim() === s.name" aria-label="Запази">✓</button>
                        <button type="button" class="row-icon-btn cancel" @click="cancelEditPlayer()" aria-label="Откажи">✕</button>
                      </form>
                    </template>
                    <!-- Action buttons (hidden during edit) -->
                    <template x-if="playerEditing !== s.name">
                      <div class="player-row-actions">
                        <button type="button" class="row-icon-btn" @click="startEditPlayer(s.name)" title="Преименуване" aria-label="Преименуване">✎</button>
                        <button type="button" class="row-icon-btn danger" @click="confirmDeletePlayer(s.name)" title="Изтрий" aria-label="Изтрий">🗑</button>
                      </div>
                    </template>
                  </div>
                </template>
                <p class="player-row-error" x-show="playerEditError && playerEditing && adminPlayersGrouped.active.some(s => s.name === playerEditing)" x-text="playerEditError"></p>
              </div>
            </template>

            <!-- Inactive players section -->
            <template x-if="adminPlayersGrouped.inactive.length > 0">
              <div class="players-section">
                <div class="players-section-head">
                  <span>Без мачове</span>
                  <span class="ps-count" x-text="adminPlayersGrouped.inactive.length"></span>
                </div>
                <template x-for="s in adminPlayersGrouped.inactive" :key="'i-' + s.name">
                  <div class="player-row dim" :class="{editing: playerEditing === s.name}">
                    <span class="avatar sm" :style="`--avatar-hue:${playerHue(s.name)}`" x-text="initials(s.name)"></span>
                    <template x-if="playerEditing !== s.name">
                      <div class="player-row-info">
                        <span class="player-row-name" x-text="s.name"></span>
                        <span class="player-row-meta empty">няма мачове</span>
                      </div>
                    </template>
                    <template x-if="playerEditing === s.name">
                      <form class="player-row-edit" @submit.prevent="saveEditPlayer()">
                        <input type="text" x-model="playerEditValue" maxlength="40"
                               @keydown.escape.prevent="cancelEditPlayer()" />
                        <button type="submit" class="row-icon-btn save" :disabled="!playerEditValue.trim() || playerEditValue.trim() === s.name" aria-label="Запази">✓</button>
                        <button type="button" class="row-icon-btn cancel" @click="cancelEditPlayer()" aria-label="Откажи">✕</button>
                      </form>
                    </template>
                    <template x-if="playerEditing !== s.name">
                      <div class="player-row-actions">
                        <button type="button" class="row-icon-btn" @click="startEditPlayer(s.name)" title="Преименуване" aria-label="Преименуване">✎</button>
                        <button type="button" class="row-icon-btn danger" @click="confirmDeletePlayer(s.name)" title="Изтрий" aria-label="Изтрий">🗑</button>
                      </div>
                    </template>
                  </div>
                </template>
                <p class="player-row-error" x-show="playerEditError && playerEditing && adminPlayersGrouped.inactive.some(s => s.name === playerEditing)" x-text="playerEditError"></p>
              </div>
            </template>

            <!-- Empty search -->
            <div class="duels-empty" x-show="playerSearch && adminPlayersGrouped.active.length === 0 && adminPlayersGrouped.inactive.length === 0">
              Няма играч с име "<span x-text="playerSearch"></span>"
            </div>
          </div>

          <!-- ===== Delete-player confirmation sheet ===== -->
          <div class="admin-menu-backdrop" x-show="playerDeleting" @click="cancelDeletePlayer()" x-transition.opacity style="display:none"></div>
          <div class="player-delete-sheet" x-show="playerDeleting" x-transition style="display:none">
            <template x-if="playerDeleting">
              <div>
                <div class="admin-menu-handle"></div>
                <div class="player-delete-icon">⚠️</div>
                <h3 class="player-delete-title">
                  Изтрий <span x-text="playerDeleting.name"></span>?
                </h3>
                <p class="player-delete-msg" x-show="playerDeleting.played > 0">
                  Този играч има <strong x-text="playerDeleting.played"></strong>
                  <span x-text="playerDeleting.played === 1 ? 'изигран мач' : 'изиграни мача'"></span> —
                  всички резултати ще бъдат премахнати <strong>завинаги</strong>.
                </p>
                <p class="player-delete-msg muted" x-show="playerDeleting.played === 0">
                  Този играч няма изиграни мачове.
                </p>
                <div class="player-delete-actions">
                  <button class="btn-ghost" @click="cancelDeletePlayer()">Откажи</button>
                  <button class="btn-danger-solid" @click="executeDeletePlayer()">Изтрий</button>
                </div>
              </div>
            </template>
          </div>

          <!-- ===== Match actions bottom sheet ===== -->
          <div class="admin-menu-backdrop" x-show="adminMatchActions" @click="closeMatchActions()" x-transition.opacity style="display:none"></div>
          <div class="admin-match-sheet" x-show="adminMatchActions" x-transition style="display:none">
            <template x-if="adminMatchActions">
              <div>
                <div class="admin-menu-handle"></div>
                <div class="match-sheet-head">
                  <span x-text="adminMatchActions.p1"></span>
                  <span class="vs">vs</span>
                  <span x-text="adminMatchActions.p2"></span>
                </div>
                <template x-for="(act, i) in secondaryActionsFor(adminMatchActions)" :key="i">
                  <button class="admin-menu-item" :class="{danger: act.danger}" @click="closeMatchActions(); act.handler()">
                    <span class="mi-icon" x-text="act.icon"></span>
                    <span class="mi-label" x-text="act.label"></span>
                  </button>
                </template>
                <button class="btn-ghost full match-sheet-cancel" @click="closeMatchActions()">Откажи</button>
              </div>
            </template>
          </div>
        </div>
      </template>
    </section>
    </template>
  </main>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <button :class="{active: view==='standings'}" @click="view='standings'">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">Класиране</span>
    </button>
    <button :class="{active: view==='upcoming'}" @click="view='upcoming'">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Предстоящи</span>
      <span class="nav-badge" x-show="activeScheduledMatches.length > 0" x-text="activeScheduledMatches.length"></span>
    </button>
    <button :class="{active: view==='grid'}" @click="view='grid'">
      <span class="nav-icon">⚔️</span>
      <span class="nav-label">Двубои</span>
    </button>
    <button :class="{active: view==='admin'}" @click="view='admin'">
      <span class="nav-icon" x-text="isAdmin ? '🔓' : '🔒'"></span>
      <span class="nav-label">Админ</span>
    </button>
  </nav>

  <!-- ===== SCORE MODAL ===== -->
  <div class="modal-backdrop" x-show="scoreMatch" @click.self="scoreMatch=null" x-transition.opacity style="display:none">
    <div class="modal" x-show="scoreMatch" x-transition>
      <template x-if="scoreMatch">
        <div>
          <div class="modal-head">
            <button class="btn-close" @click="scoreMatch=null">✕</button>
            <h3 x-text="scoreMatch.playNum ? 'Мач #' + scoreMatch.playNum : 'Запис на резултат'"></h3>
            <div style="width:36px"></div>
          </div>
          <div class="modal-vs">
            <div class="modal-vs-player">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(scoreMatch.p1)}`" x-text="initials(scoreMatch.p1)"></span>
              <span x-text="scoreMatch.p1"></span>
            </div>
            <div class="modal-vs-sep">vs</div>
            <div class="modal-vs-player">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(scoreMatch.p2)}`" x-text="initials(scoreMatch.p2)"></span>
              <span x-text="scoreMatch.p2"></span>
            </div>
          </div>
          <div class="score-options">
            <button class="score-btn" @click="setResult(scoreMatch, 2, 0)">
              <span class="score-num">2 : 0</span>
              <span class="score-who"><strong x-text="scoreMatch.p1"></strong> печели</span>
            </button>
            <button class="score-btn" @click="setResult(scoreMatch, 2, 1)">
              <span class="score-num">2 : 1</span>
              <span class="score-who"><strong x-text="scoreMatch.p1"></strong> печели</span>
            </button>
            <button class="score-btn" @click="setResult(scoreMatch, 1, 2)">
              <span class="score-num">1 : 2</span>
              <span class="score-who"><strong x-text="scoreMatch.p2"></strong> печели</span>
            </button>
            <button class="score-btn" @click="setResult(scoreMatch, 0, 2)">
              <span class="score-num">0 : 2</span>
              <span class="score-who"><strong x-text="scoreMatch.p2"></strong> печели</span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===== SCHEDULE MODAL (single match quick reschedule) ===== -->
  <div class="modal-backdrop" x-show="scheduleMatch" @click.self="scheduleMatch=null" x-transition.opacity style="display:none">
    <div class="modal" x-show="scheduleMatch" x-transition>
      <template x-if="scheduleMatch">
        <div>
          <div class="modal-head">
            <button class="btn-close" @click="scheduleMatch=null">✕</button>
            <h3>Планирай мач</h3>
            <div style="width:36px"></div>
          </div>
          <div class="modal-vs">
            <div class="modal-vs-player">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(scheduleMatch.p1)}`" x-text="initials(scheduleMatch.p1)"></span>
              <span x-text="scheduleMatch.p1"></span>
            </div>
            <div class="modal-vs-sep">vs</div>
            <div class="modal-vs-player">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(scheduleMatch.p2)}`" x-text="initials(scheduleMatch.p2)"></span>
              <span x-text="scheduleMatch.p2"></span>
            </div>
          </div>
          <label class="form-label">Дата и час</label>
          <input type="datetime-local" x-model="scheduleInput" class="form-input" />
          <div class="modal-actions">
            <button class="btn-ghost" @click="scheduleMatch=null">Откажи</button>
            <button class="btn-primary" @click="setSchedule(scheduleMatch, scheduleInput)" :disabled="!scheduleInput">Запази</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===== WIZARD MODAL ===== -->
  <div class="modal-backdrop wizard-backdrop" x-show="wizard.open" @click.self="closeWizard()" x-transition.opacity style="display:none">
    <div class="modal wizard-modal" x-show="wizard.open" x-transition>
      <div class="wizard-head">
        <button class="btn-close" @click="wizard.step > 1 ? wizardBack() : closeWizard()" x-text="wizard.step > 1 ? '←' : '✕'"></button>
        <div class="wizard-title">
          <h3 x-text="wizardTitle"></h3>
          <div class="wizard-steps">
            <template x-for="i in (wizard.mode === 'schedule' ? 4 : 3)" :key="i">
              <span class="wizard-dot" :class="{active: i <= wizard.step, current: i === wizard.step}"></span>
            </template>
          </div>
        </div>
        <div style="width:36px"></div>
      </div>

      <template x-if="wizard.step >= 2">
        <div class="wizard-summary">
          <div class="wizard-summary-pill">
            <span class="avatar sm" :style="`--avatar-hue:${playerHue(wizard.playerA)}`" x-text="initials(wizard.playerA)"></span>
            <span x-text="wizard.playerA"></span>
          </div>
          <template x-if="wizard.playerB">
            <span class="wizard-summary-vs">vs</span>
          </template>
          <template x-if="wizard.playerB">
            <div class="wizard-summary-pill">
              <span class="avatar sm" :style="`--avatar-hue:${playerHue(wizard.playerB)}`" x-text="initials(wizard.playerB)"></span>
              <span x-text="wizard.playerB"></span>
            </div>
          </template>
        </div>
      </template>

      <!-- STEP 1: Player A (with scheduled shortcuts for result mode) -->
      <div class="wizard-step" x-show="wizard.step === 1">
        <template x-if="wizard.mode === 'result' && scheduledMatches.length > 0">
          <div>
            <div class="wizard-section-title">📅 Планирани мачове · бързо записване</div>
            <div class="scheduled-shortcuts">
              <template x-for="m in scheduledMatches" :key="m.key">
                <button class="scheduled-shortcut" @click="wizardPickScheduledForResult(m)">
                  <div class="scheduled-shortcut-top">
                    <span class="scheduled-shortcut-rel" x-show="dateRelative(m.scheduledAt)" x-text="dateRelative(m.scheduledAt)"></span>
                    <span class="scheduled-shortcut-time" x-text="formatDate(m.scheduledAt)"></span>
                  </div>
                  <div class="scheduled-shortcut-vs">
                    <div class="ssvs-player">
                      <span class="avatar sm" :style="`--avatar-hue:${playerHue(m.p1)}`" x-text="initials(m.p1)"></span>
                      <span x-text="m.p1"></span>
                    </div>
                    <span class="ssvs-sep">vs</span>
                    <div class="ssvs-player right">
                      <span x-text="m.p2"></span>
                      <span class="avatar sm" :style="`--avatar-hue:${playerHue(m.p2)}`" x-text="initials(m.p2)"></span>
                    </div>
                  </div>
                </button>
              </template>
            </div>
            <div class="wizard-section-title">Или избери играч ръчно</div>
          </div>
        </template>
        <div class="player-grid">
          <template x-for="p in players" :key="p">
            <button class="player-btn" @click="wizardSelectA(p)">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(p)}`" x-text="initials(p)"></span>
              <span class="player-btn-name" x-text="p"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- STEP 2: Player B -->
      <div class="wizard-step" x-show="wizard.step === 2">
        <template x-if="wizardOpponents.length === 0">
          <div class="wizard-empty">
            <div class="empty-icon">✓</div>
            <h3>Няма свободни опоненти</h3>
            <p>Този играч вече е играл с всички!</p>
          </div>
        </template>
        <div class="player-grid">
          <template x-for="op in wizardOpponents" :key="op.name">
            <button class="player-btn" :class="{scheduled: op.scheduledAt}" @click="wizardSelectB(op.name)">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(op.name)}`" x-text="initials(op.name)"></span>
              <span class="player-btn-name" x-text="op.name"></span>
              <span class="player-btn-pill" x-show="op.scheduledAt" x-text="'📅 ' + formatDate(op.scheduledAt)"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- STEP 3 schedule: Calendar -->
      <div class="wizard-step" x-show="wizard.step === 3 && wizard.mode === 'schedule'">
        <div class="calendar">
          <div class="calendar-head">
            <button class="cal-nav" @click="calPrevMonth()">‹</button>
            <div class="cal-month" x-text="calendarMonthLabel"></div>
            <button class="cal-nav" @click="calNextMonth()">›</button>
          </div>
          <div class="calendar-weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span>
          </div>
          <div class="calendar-grid">
            <template x-for="d in calendarDays" :key="d.date">
              <button
                class="cal-day"
                :class="{
                  'cal-other': d.isOtherMonth,
                  'cal-past': d.isPast,
                  'cal-today': d.isToday,
                  'cal-has': d.hasMatches,
                  'cal-selected': wizard.date === d.date
                }"
                :disabled="d.isPast"
                @click="wizardSelectDate(d.date)"
                x-text="d.day"
              ></button>
            </template>
          </div>
        </div>
      </div>

      <!-- STEP 4 schedule: Time -->
      <div class="wizard-step" x-show="wizard.step === 4 && wizard.mode === 'schedule'">
        <div class="time-presets">
          <template x-for="t in timePresets" :key="t">
            <button class="time-btn" :class="{active: wizard.time === t}" @click="wizard.time = t" x-text="t"></button>
          </template>
        </div>
        <div class="time-custom">
          <label class="form-label">Друг час</label>
          <input type="time" x-model="wizard.time" class="form-input" />
        </div>
        <div class="wizard-confirm-card" x-show="wizard.date && wizard.time">
          <div class="wizard-confirm-text">
            <strong x-text="wizard.playerA"></strong> срещу <strong x-text="wizard.playerB"></strong>
            <br />
            <span x-text="wizardConfirmDateText"></span>
          </div>
        </div>
        <button class="btn-primary full big" @click="wizardConfirmSchedule()" :disabled="!wizard.time">
          ✓ Потвърди планирането
        </button>
      </div>

      <!-- STEP 3 result: Score -->
      <div class="wizard-step" x-show="wizard.step === 3 && wizard.mode === 'result'">
        <div class="score-options">
          <button class="score-btn" @click="wizardConfirmResult(2, 0)">
            <span class="score-num">2 : 0</span>
            <span class="score-who"><strong x-text="wizard.playerA"></strong> печели</span>
          </button>
          <button class="score-btn" @click="wizardConfirmResult(2, 1)">
            <span class="score-num">2 : 1</span>
            <span class="score-who"><strong x-text="wizard.playerA"></strong> печели</span>
          </button>
          <button class="score-btn" @click="wizardConfirmResult(1, 2)">
            <span class="score-num">1 : 2</span>
            <span class="score-who"><strong x-text="wizard.playerB"></strong> печели</span>
          </button>
          <button class="score-btn" @click="wizardConfirmResult(0, 2)">
            <span class="score-num">0 : 2</span>
            <span class="score-who"><strong x-text="wizard.playerB"></strong> печели</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== LIVE SCORING MODAL ===== -->
  <div class="modal-backdrop live-backdrop" x-show="liveMatch" @click.self="closeLive()" x-transition.opacity style="display:none">
    <div class="modal live-modal" x-show="liveMatch" x-transition>
      <template x-if="liveMatch">
        <div>
          <div class="modal-head live-modal-head">
            <button class="btn-close" @click="closeLive()">✕</button>
            <h3>
              <span class="live-dot"></span>
              На живо
            </h3>
            <div style="width:36px"></div>
          </div>

          <!-- Sets summary — full row per set, winner side highlighted -->
          <div class="live-sets-summary" x-show="liveDraft.sets.length > 0">
            <div class="live-sets-label">Изиграни сетове</div>
            <template x-for="(s, i) in liveDraft.sets" :key="i">
              <div class="live-set-row">
                <span class="live-set-num">Сет <span x-text="i+1"></span></span>
                <div class="live-set-pair">
                  <div class="live-set-side" :class="{won: s[0]>s[1]}">
                    <span class="avatar xs" :style="`--avatar-hue:${playerHue(liveMatch.p1)}`" x-text="initials(liveMatch.p1)"></span>
                    <span class="live-set-name" x-text="liveMatch.p1"></span>
                    <span class="live-set-num-big" x-text="s[0]"></span>
                  </div>
                  <span class="live-set-mid">:</span>
                  <div class="live-set-side right" :class="{won: s[1]>s[0]}">
                    <span class="live-set-num-big" x-text="s[1]"></span>
                    <span class="live-set-name" x-text="liveMatch.p2"></span>
                    <span class="avatar xs" :style="`--avatar-hue:${playerHue(liveMatch.p2)}`" x-text="initials(liveMatch.p2)"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Mode label -->
          <div class="live-mode-label">
            <template x-if="!liveDraft.tb">
              <span>Текущ сет</span>
            </template>
            <template x-if="liveDraft.tb">
              <span class="live-tb-label">⚡ TIEBREAK · първи до 7 (с 2 разлика)</span>
            </template>
          </div>

          <!-- Player columns (each = a tap target for +1) -->
          <div class="live-scoreboard" :class="{tb: liveDraft.tb}">
            <button
              class="live-col"
              :class="{leader: !liveDraft.tb && liveDraft.cur[0] > liveDraft.cur[1] || liveDraft.tb && liveDraft.tb[0] > liveDraft.tb[1]}"
              @click="liveAddPoint(0)">
              <div class="live-col-head">
                <span class="avatar sm" :style="`--avatar-hue:${playerHue(liveMatch.p1)}`" x-text="initials(liveMatch.p1)"></span>
                <span class="live-col-name" x-text="liveMatch.p1"></span>
              </div>
              <div class="live-col-sets">
                <span x-text="liveSetsWon(liveMatch)[0]"></span>
                <small>сета</small>
              </div>
              <div class="live-col-num" x-text="liveDraft.tb ? liveDraft.tb[0] : liveDraft.cur[0]"></div>
              <div class="live-col-tap">+1 гейм</div>
            </button>

            <div class="live-col-mid">:</div>

            <button
              class="live-col"
              :class="{leader: !liveDraft.tb && liveDraft.cur[1] > liveDraft.cur[0] || liveDraft.tb && liveDraft.tb[1] > liveDraft.tb[0]}"
              @click="liveAddPoint(1)">
              <div class="live-col-head">
                <span class="avatar sm" :style="`--avatar-hue:${playerHue(liveMatch.p2)}`" x-text="initials(liveMatch.p2)"></span>
                <span class="live-col-name" x-text="liveMatch.p2"></span>
              </div>
              <div class="live-col-sets">
                <span x-text="liveSetsWon(liveMatch)[1]"></span>
                <small>сета</small>
              </div>
              <div class="live-col-num" x-text="liveDraft.tb ? liveDraft.tb[1] : liveDraft.cur[1]"></div>
              <div class="live-col-tap">+1 гейм</div>
            </button>
          </div>

          <!-- Undo controls — aligned under each column above -->
          <div class="live-undo-row">
            <button
              class="live-undo"
              @click.stop="liveSubPoint(0)"
              :disabled="(liveDraft.tb ? liveDraft.tb[0] : liveDraft.cur[0]) === 0">
              <span class="live-undo-icon">−</span>
              <span>1 гейм</span>
            </button>
            <div class="live-undo-mid"></div>
            <button
              class="live-undo"
              @click.stop="liveSubPoint(1)"
              :disabled="(liveDraft.tb ? liveDraft.tb[1] : liveDraft.cur[1]) === 0">
              <span class="live-undo-icon">−</span>
              <span>1 гейм</span>
            </button>
          </div>

          <!-- End-of-set / cancel-tb button -->
          <template x-if="!liveDraft.tb">
            <button
              class="live-end-set"
              :class="{ready: liveCanEndSet()}"
              @click="liveEndCurrentSet()"
              :disabled="!liveCanEndSet()">
              <template x-if="liveCanEndSet()">
                <span>
                  ✓ Завърши сета —
                  <strong x-text="(liveDraft.cur[0] > liveDraft.cur[1] ? liveMatch.p1 : liveMatch.p2)"></strong>
                  печели
                </span>
              </template>
              <template x-if="!liveCanEndSet() && liveDraft.cur[0] === 0 && liveDraft.cur[1] === 0">
                <span class="live-end-hint">Кликни играч за +1 гейм</span>
              </template>
              <template x-if="!liveCanEndSet() && liveDraft.cur[0] === liveDraft.cur[1] && liveDraft.cur[0] > 0">
                <span class="live-end-hint">Равенство — играйте още</span>
              </template>
            </button>
          </template>

          <template x-if="liveDraft.tb">
            <button class="live-end-set ghost" @click="liveExitTiebreak()">
              ↩ Откажи tiebreak
            </button>
          </template>

          <template x-if="liveCanUndoSet()">
            <button class="live-end-set ghost" @click="liveUndoLastSet()">
              ↶ Върни последния сет
            </button>
          </template>

          <!-- Status / errors -->
          <div class="live-status">
            <span x-show="livePending" class="status-saving">⟳ Запис...</span>
            <span x-show="!livePending && !liveError" class="status-saved">✓ Синхронизирано</span>
            <span x-show="liveError" class="status-error" x-text="liveError"></span>
          </div>

          <p class="live-hint">
            Авто-финал при <strong>2 спечелени сета</strong>.
          </p>
        </div>
      </template>
    </div>
  </div>

  <!-- ===== FINALIZE CONFIRM MODAL (best-of-3 reached) ===== -->
  <div class="modal-backdrop finalize-backdrop" x-show="pendingFinalize" @click.self="cancelFinalize()" x-transition.opacity style="display:none">
    <div class="modal finalize-modal" x-show="pendingFinalize" x-transition>
      <template x-if="pendingFinalize">
        <div>
          <div class="modal-head">
            <button class="btn-close" @click="cancelFinalize()">✕</button>
            <h3>Приключване на мача?</h3>
            <div style="width:36px"></div>
          </div>

          <div class="finalize-trophy">🏆</div>

          <div class="finalize-winner">
            <span class="avatar xl" :style="`--avatar-hue:${playerHue(pendingFinalize.winner)}`" x-text="initials(pendingFinalize.winner)"></span>
            <div class="finalize-winner-name" x-text="pendingFinalize.winner"></div>
            <div class="finalize-winner-label">печели</div>
          </div>

          <div class="finalize-score">
            <span class="finalize-score-num" :class="{lose: pendingFinalize.setsA < pendingFinalize.setsB}" x-text="pendingFinalize.setsA"></span>
            <span class="finalize-score-colon">:</span>
            <span class="finalize-score-num" :class="{lose: pendingFinalize.setsB < pendingFinalize.setsA}" x-text="pendingFinalize.setsB"></span>
          </div>
          <div class="finalize-score-vs">
            <span x-text="liveMatch && liveMatch.p1"></span>
            <span class="finalize-score-vs-sep">vs</span>
            <span x-text="liveMatch && liveMatch.p2"></span>
          </div>

          <p class="finalize-hint">
            Тенисът се играе до <strong>2 спечелени сета</strong>.
            След "Да" резултатът се записва финално.
          </p>

          <div class="finalize-actions">
            <button class="finalize-btn cancel" @click="cancelFinalize()">
              <span class="finalize-btn-icon">↩</span>
              <span>Не, искам да коригирам</span>
            </button>
            <button class="finalize-btn confirm" @click="confirmFinalize()">
              <span class="finalize-btn-icon">✓</span>
              <span>Да, приключи мача</span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===== TODAY PICKER (Live or Final?) ===== -->
  <div class="modal-backdrop" x-show="todayPicker" @click.self="closeTodayPicker()" x-transition.opacity style="display:none">
    <div class="modal" x-show="todayPicker" x-transition>
      <template x-if="todayPicker">
        <div>
          <div class="modal-head">
            <button class="btn-close" @click="closeTodayPicker()">✕</button>
            <h3>Как да въведем резултата?</h3>
            <div style="width:36px"></div>
          </div>
          <div class="modal-vs">
            <div class="modal-vs-player">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(todayPicker.p1)}`" x-text="initials(todayPicker.p1)"></span>
              <span x-text="todayPicker.p1"></span>
            </div>
            <div class="modal-vs-sep">vs</div>
            <div class="modal-vs-player">
              <span class="avatar lg" :style="`--avatar-hue:${playerHue(todayPicker.p2)}`" x-text="initials(todayPicker.p2)"></span>
              <span x-text="todayPicker.p2"></span>
            </div>
          </div>
          <div class="today-pick-options">
            <button class="today-pick-btn live" @click="todayPickLive()">
              <span class="today-pick-icon">🔴</span>
              <span class="today-pick-text">
                <strong>На живо — по геймове</strong>
                <small>Кликвай след всеки гейм; авто-финал при 2 сета</small>
              </span>
            </button>
            <button class="today-pick-btn final" @click="todayPickFinal()">
              <span class="today-pick-icon">🏁</span>
              <span class="today-pick-text">
                <strong>Краен резултат — сетове</strong>
                <small>Директно избери 2:0, 2:1, 1:2 или 0:2</small>
              </span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===== PLAYER PICKER MODAL ===== -->
  <div class="modal-backdrop" x-show="playerPicker.open" @click.self="closePlayerPicker()" x-transition.opacity style="display:none">
    <div class="modal" x-show="playerPicker.open" x-transition>
      <div class="modal-head">
        <button class="btn-close" @click="closePlayerPicker()">✕</button>
        <h3 x-text="playerPicker.title"></h3>
        <div style="width:36px"></div>
      </div>
      <button class="player-all-btn" x-show="playerPicker.showAll" @click="selectPickerPlayer('')">
        <span class="player-all-icon">👥</span>
        <span>Всички играчи</span>
      </button>
      <div class="player-grid">
        <template x-for="p in players" :key="p">
          <button class="player-btn" @click="selectPickerPlayer(p)">
            <span class="avatar lg" :style="`--avatar-hue:${playerHue(p)}`" x-text="initials(p)"></span>
            <span class="player-btn-name" x-text="p"></span>
            <span class="player-btn-stat" x-show="playedCountFor(p) > 0">
              <span x-text="playedCountFor(p)"></span><span class="stat-sep">/</span><span x-text="matchCountFor(p)"></span>
            </span>
          </button>
        </template>
      </div>
    </div>
  </div>
</body>
</html>
