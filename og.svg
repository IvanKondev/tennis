<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1d3024"/>
      <stop offset="60%" stop-color="#16261c"/>
      <stop offset="100%" stop-color="#0a1610"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4ce5a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9c7818"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#eaf266"/>
      <stop offset="65%" stop-color="#c8d962"/>
      <stop offset="100%" stop-color="#7a8d35"/>
    </radialGradient>
    <radialGradient id="ballShine" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ballGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle court line pattern -->
  <g stroke="#243a2c" stroke-width="1" opacity="0.45">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
    <line x1="600" y1="0" x2="600" y2="630" opacity="0.3"/>
  </g>

  <!-- Soft glow behind title -->
  <ellipse cx="430" cy="320" rx="380" ry="120" fill="#d4af37" opacity="0.1" filter="url(#goldGlow)"/>

  <!-- Tennis ball, top right -->
  <g transform="translate(990 200)">
    <circle r="135" fill="#c8d962" opacity="0.18" filter="url(#ballGlow)"/>
    <circle r="108" fill="url(#ball)"/>
    <circle r="108" fill="url(#ballShine)"/>
    <path d="M -103 -19 Q 0 44 103 -19" stroke="#fffbe5" stroke-width="3.5" fill="none" opacity="0.85" stroke-linecap="round"/>
    <path d="M -103 19 Q 0 -44 103 19" stroke="#fffbe5" stroke-width="3.5" fill="none" opacity="0.85" stroke-linecap="round"/>
  </g>

  <!-- Top badge -->
  <g transform="translate(80 100)">
    <rect width="295" height="46" rx="23" fill="#16261c" stroke="#d4af37" stroke-opacity="0.4"/>
    <circle cx="24" cy="23" r="7" fill="#c8d962"/>
    <text x="46" y="30" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8c969" font-weight="600" letter-spacing="2">СЕЗОН 2026 · ТЕНИС ЛИГА</text>
  </g>

  <!-- Title -->
  <text x="80" y="280" font-family="Impact, 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="#f3ecd6" letter-spacing="2">ТЕНИС ЛИГА</text>
  <text x="80" y="382" font-family="Impact, 'Arial Black', sans-serif" font-size="124" font-weight="900" fill="url(#gold)" letter-spacing="3">ВЕЛИНГРАД</text>

  <!-- Tagline -->
  <text x="80" y="438" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#d8d0bc" font-weight="400">Всеки срещу всеки · до 2 спечелени сета · 20 играчи</text>

  <!-- Bottom bar -->
  <line x1="80" y1="500" x2="1120" y2="500" stroke="#d4af37" stroke-width="1" opacity="0.35"/>

  <!-- LIVE pill -->
  <g transform="translate(80 525)">
    <rect width="220" height="50" rx="10" fill="#16261c" stroke="#ef4444" stroke-opacity="0.55"/>
    <circle cx="22" cy="25" r="6" fill="#ef4444"/>
    <text x="40" y="33" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fca5a5" font-weight="700" letter-spacing="2">LIVE РЕЗУЛТАТИ</text>
  </g>

  <!-- URL bottom right -->
  <text x="1120" y="558" font-family="'SF Mono', Menlo, monospace" font-size="20" fill="#d4af37" font-weight="700" text-anchor="end" letter-spacing="2">tennis.unrealsoft.bg</text>
</svg>
